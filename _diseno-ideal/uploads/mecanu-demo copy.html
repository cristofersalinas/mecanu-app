// Modal de detalle de un auto: muestra sus datos y TODOS los usuarios registrados en él (relación muchos-a-muchos),
// con navegación cruzada directa a la ficha de cada uno de esos clientes.
function AutoDetalleModal({ vehiculoId, onClose, onAbrirCliente }) {
  const veh = getVehicle(vehiculoId);
  if (!veh) return null;
  const usuarios = getUsuariosVehiculo(vehiculoId);
  return (
    <Modal title={`${veh.marca} ${veh.modelo} · ${veh.matricula}`} onClose={onClose}>
      <div className="grid grid-cols-2 gap-3 mb-4 text-sm">
        <DatoLinea label="Año" value={veh.anio} />
        <DatoLinea label="Color" value={veh.color} />
        <DatoLinea label="Kilometraje" value={`${veh.km.toLocaleString('es-ES')} km`} />
        <DatoLinea label="Matrícula" value={veh.matricula} />
      </div>
      <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Usuarios registrados en este vehículo ({usuarios.length})</h3>
      <div className="space-y-2">
        {usuarios.map(u => (
          <button
            key={u.clienteId} type="button"
            onClick={() => onAbrirCliente(u.clienteId)}
            className="w-full flex items-center justify-between text-left bg-slate-50 hover:bg-slate-100 rounded-lg px-3 py-2.5 transition-colors"
          >
            <div>
              <div className="text-sm font-semibold text-slate-800">{u.persona.nombre}{u.esPrincipal ? ' · Titular' : ''}</div>
              <div className="text-xs text-slate-500">{u.relacion} · {u.persona.telefono}</div>
            </div>
            <span className="text-slate-400 text-sm">→</span>
          </button>
        ))}
      </div>
    </Modal>
  );
}

function TallerClientes({ traslados, brand, onAbrirCliente }) {
  const [tab, setTab] = useState('clientes'); // 'clientes' | 'autos'
  const [vista, setVista] = useState('lista');
  const [busqueda, setBusqueda] = useState('');
  const [autoAbierto, setAutoAbierto] = useState(null);

  const filas = useMemo(() => {
    return CLIENTS
      .map(c => {
        const historial = traslados.filter(t => t.clienteId === c.id);
        const completados = historial.filter(t => t.estado === ESTADOS.ENTREGADO);
        const ultima = completados.reduce((max, t) => (!max || t.fecha > max.fecha) ? t : max, null);
        const vehiculos = getVehiculosDeCliente(c.id);
        const lifecycle = getLifecycleTag(c.id, traslados);
        return { cliente: c, historial, completados, ultima, vehiculos, lifecycle };
      })
      .filter(f => !busqueda.trim() || f.cliente.nombre.toLowerCase().includes(busqueda.toLowerCase()) || f.vehiculos.some(v => normalizePlate(v.v.matricula).includes(normalizePlate(busqueda))));
  }, [traslados, busqueda]);

  const grupos = useMemo(() => {
    const g = {};
    Object.keys(LIFECYCLE_META).forEach(k => g[k] = []);
    filas.forEach(f => {
      const key = Object.keys(LIFECYCLE_META).find(k => LIFECYCLE_META[k].label === f.lifecycle.label);
      g[key].push(f);
    });
    return g;
  }, [filas]);

  const filasAutos = useMemo(() => {
    const q = busqueda.trim().toLowerCase();
    return Object.entries(VEHICLES)
      .map(([id, v]) => ({ id, v, usuarios: getUsuariosVehiculo(id) }))
      .filter(f => !q || normalizePlate(f.v.matricula).includes(normalizePlate(busqueda)) || `${f.v.marca} ${f.v.modelo}`.toLowerCase().includes(q) || f.usuarios.some(u => u.persona.nombre.toLowerCase().includes(q)));
  }, [busqueda]);

  return (
    <div>
      <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
        <h1 className="text-2xl font-bold text-slate-800">Clientes</h1>
        {tab === 'clientes' && <ViewToggle vista={vista} setVista={setVista} />}
      </div>
      <p className="text-sm text-slate-500 mb-4">Historial de servicios, última compra, ciclo de vida y la relación entre clientes y sus vehículos (un cliente puede tener varios autos; un auto puede tener varios usuarios registrados).</p>

      <div className="inline-flex items-center gap-0.5 bg-slate-100 rounded-lg p-0.5 mb-4">
        <button onClick={() => setTab('clientes')} className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-colors ${tab === 'clientes' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500'}`}>Clientes ({CLIENTS.length})</button>
        <button onClick={() => setTab('autos')} className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-colors ${tab === 'autos' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500'}`}>Autos ({Object.keys(VEHICLES).length})</button>
      </div>

      <input
        value={busqueda} onChange={e => setBusqueda(e.target.value)}
        placeholder={tab === 'clientes' ? 'Buscar por nombre o matrícula...' : 'Buscar por marca, modelo, matrícula o usuario...'}
        className="w-full max-w-md px-3 py-2 rounded-lg border border-slate-300 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400/40"
      />

      {tab === 'clientes' ? (vista === 'lista' ? (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 border-b border-slate-200">
              <tr>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase px-4 py-3">Cliente</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase px-4 py-3">Autos</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase px-4 py-3">Servicios</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase px-4 py-3">Última compra</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase px-4 py-3">Ciclo de vida</th>
                <th className="w-8"></th>
              </tr>
            </thead>
            <tbody>
              {filas.map(f => (
                <tr key={f.cliente.id} onClick={() => onAbrirCliente(f.cliente.id)} className="border-b border-slate-100 last:border-0 hover:bg-slate-50 cursor-pointer">
                  <td className="px-4 py-3">
                    <div className="font-semibold text-slate-800">{f.cliente.nombre}</div>
                    <div className="text-xs text-slate-500">{f.cliente.telefono}</div>
                  </td>
                  <td className="px-4 py-3 text-xs text-slate-600">
                    <span className="font-semibold text-slate-700">{f.vehiculos.length}</span> auto{f.vehiculos.length !== 1 ? 's' : ''}
                    <div className="text-slate-400">{f.vehiculos.map(v => v.v.matricula).join(', ') || '—'}</div>
                  </td>
                  <td className="px-4 py-3 text-slate-700">{f.completados.length}</td>
                  <td className="px-4 py-3 text-xs text-slate-600">{f.ultima ? `${formatDayLabel(f.ultima.fecha)} · ${formatMoney(estimarImporte(f.ultima))}` : '—'}</td>
                  <td className="px-4 py-3">
                    <span title={f.lifecycle.descripcion} className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold cursor-help" style={{ color: f.lifecycle.color, backgroundColor: f.lifecycle.bg }}>{f.lifecycle.label}</span>
                  </td>
                  <td className="px-2 py-3 text-slate-300">→</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ) : (
        <div className="flex gap-3 overflow-x-auto pb-3">
          {Object.entries(grupos).map(([key, lista]) => (
            <div key={key} className="w-64 shrink-0 rounded-xl p-2 bg-slate-100">
              <div className="flex items-center justify-between px-1 mb-2">
                <span title={LIFECYCLE_META[key].descripcion} className="text-xs font-bold uppercase tracking-wide cursor-help" style={{ color: LIFECYCLE_META[key].color }}>{LIFECYCLE_META[key].label}</span>
                <span className="text-xs text-slate-400">{lista.length}</span>
              </div>
              {lista.map(f => (
                <div key={f.cliente.id} onClick={() => onAbrirCliente(f.cliente.id)} className="bg-white rounded-lg border border-slate-200 p-3 mb-2 shadow-sm hover:shadow-md cursor-pointer">
                  <p className="text-sm font-semibold text-slate-800">{f.cliente.nombre}</p>
                  <p className="text-xs text-slate-500">{f.completados.length} servicios</p>
                </div>
              ))}
              {lista.length === 0 && <p className="text-[11px] text-slate-300 text-center py-4">Sin clientes</p>}
            </div>
          ))}
        </div>
      )) : (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 border-b border-slate-200">
              <tr>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase px-4 py-3">Vehículo</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase px-4 py-3">Matrícula</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase px-4 py-3">Kilometraje</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase px-4 py-3">Usuarios registrados</th>
                <th className="w-8"></th>
              </tr>
            </thead>
            <tbody>
              {filasAutos.map(f => (
                <tr key={f.id} onClick={() => setAutoAbierto(f.id)} className="border-b border-slate-100 last:border-0 hover:bg-slate-50 cursor-pointer">
                  <td className="px-4 py-3">
                    <div className="font-semibold text-slate-800">{f.v.marca} {f.v.modelo}</div>
                    <div className="text-xs text-slate-500">{f.v.anio} · {f.v.color}</div>
                  </td>
                  <td className="px-4 py-3 font-mono text-xs text-slate-600">{f.v.matricula}</td>
                  <td className="px-4 py-3 text-slate-700">{f.v.km.toLocaleString('es-ES')} km</td>
                  <td className="px-4 py-3">
                    <span className="font-semibold text-slate-700">{f.usuarios.length}</span> usuario{f.usuarios.length !== 1 ? 's' : ''}
                    <div className="text-xs text-slate-400">{f.usuarios.map(u => u.persona.nombre).join(', ')}</div>
                  </td>
                  <td className="px-2 py-3 text-slate-300">→</td>
                </tr>
              ))}
              {filasAutos.length === 0 && (
                <tr><td colSpan={5} className="px-4 py-10 text-center text-slate-400 text-sm">No hay autos que coincidan con la búsqueda.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      )}

      {autoAbierto && (
        <AutoDetalleModal
          vehiculoId={autoAbierto}
          onClose={() => setAutoAbierto(null)}
          onAbrirCliente={(clienteId) => { setAutoAbierto(null); onAbrirCliente(clienteId); }}
        />
      )}
    </div>
  );
}

function TallerClienteDetalle({ clienteId, traslados, brand, onBack, onOpenTraslado, onAbrirCliente }) {
  const cliente = getClient(clienteId);
  if (!cliente) return null;
  const historial = traslados.filter(t => t.clienteId === clienteId).sort((a, b) => (b.fecha || 0) - (a.fecha || 0));
  const completados = historial.filter(t => t.estado === ESTADOS.ENTREGADO);
  const cancelados = historial.filter(t => t.estado === ESTADOS.CANCELADO);
  const proximos = historial.filter(t => t.estado === ESTADOS.AGENDADO);
  const ultima = completados[0] || null;
  const vehiculos = getVehiculosDeCliente(clienteId);
  const lifecycle = getLifecycleTag(clienteId, traslados);
  const totalGastado = completados.reduce((sum, t) => sum + estimarImporte(t), 0);
  const ticketPromedio = completados.length ? totalGastado / completados.length : 0;
  const conSeguro = completados.filter(t => t.seguro).length;
  const diasComoCliente = cliente.clienteDesde ? Math.max(1, Math.round((TODAY - cliente.clienteDesde) / 86400000)) : null;
  const [autoAbierto, setAutoAbierto] = useState(null);

  return (
    <div>
      <button onClick={onBack} className="text-sm text-slate-500 hover:text-slate-800 mb-4 inline-flex items-center gap-1">← Volver a clientes</button>

      <div className="flex flex-wrap items-center gap-3 mb-1">
        <h1 className="text-2xl font-bold text-slate-800">{cliente.nombre}</h1>
        <span title={lifecycle.descripcion} className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold cursor-help" style={{ color: lifecycle.color, backgroundColor: lifecycle.bg }}>{lifecycle.label}</span>
        {ultima && (
          <button onClick={() => onOpenTraslado(ultima.id)} className="ml-auto text-xs font-semibold px-3 py-1.5 rounded-lg border-2 inline-flex items-center gap-1" style={{ borderColor: brand.color, color: brand.color }}>
            Ver último servicio ({ultima.id}) <span aria-hidden="true">→</span>
          </button>
        )}
      </div>
      <p className="text-xs text-slate-400 mb-6">{lifecycle.descripcion}</p>

      <div className="bg-white rounded-xl border border-slate-200 p-4 mb-6 flex flex-wrap gap-x-6 gap-y-2 text-sm">
        <div className="flex items-center gap-1.5 text-slate-600"><span aria-hidden="true">📞</span> {cliente.telefono}</div>
        <div className="flex items-center gap-1.5 text-slate-600"><span aria-hidden="true">📍</span> {cliente.direccion || 'Sin dirección registrada'}</div>
        <div className="flex items-center gap-1.5 text-slate-600"><span aria-hidden="true">🗓️</span> Cliente desde {cliente.clienteDesde ? formatDayLabel(cliente.clienteDesde) : '—'}{diasComoCliente ? ` (${diasComoCliente} días)` : ''}</div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-xs text-slate-400">Servicios completados</div>
          <div className="text-xl font-bold text-slate-800">{completados.length}</div>
          <div className="text-[11px] text-slate-400">{proximos.length} próximo{proximos.length !== 1 ? 's' : ''} · {cancelados.length} cancelado{cancelados.length !== 1 ? 's' : ''}</div>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-xs text-slate-400">Total facturado (estimado)</div>
          <div className="text-xl font-bold text-slate-800">{formatMoney(totalGastado)}</div>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-xs text-slate-400">Ticket medio</div>
          <div className="text-xl font-bold text-slate-800">{formatMoney(ticketPromedio)}</div>
          <div className="text-[11px] text-slate-400">{conSeguro} con seguro contratado</div>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-xs text-slate-400">Autos registrados</div>
          <div className="text-xl font-bold text-slate-800">{vehiculos.length}</div>
          <div className="text-[11px] text-slate-400">Puede compartir auto(s) con otros usuarios</div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <SeccionCard title={`Vehículos asociados (${vehiculos.length})`}>
          {vehiculos.length === 0 ? <p className="text-sm text-slate-400 italic">Sin vehículos registrados.</p> : (
            <div className="space-y-2">
              {vehiculos.map(v => {
                const otrosUsuarios = getUsuariosVehiculo(v.id).length - 1;
                return (
                  <button
                    key={v.id} type="button" onClick={() => setAutoAbierto(v.id)}
                    className="w-full text-left flex items-center justify-between bg-slate-50 hover:bg-slate-100 rounded-lg p-3 transition-colors"
                  >
                    <div>
                      <div className="flex justify-between text-sm gap-3">
                        <span className="font-semibold text-slate-800">{v.v.marca} {v.v.modelo}</span>
                        <span className="font-mono text-xs text-slate-500">{v.v.matricula}</span>
                      </div>
                      <p className="text-xs text-slate-500">{v.relacion} · {v.v.anio}{otrosUsuarios > 0 ? ` · compartido con ${otrosUsuarios} usuario${otrosUsuarios !== 1 ? 's' : ''} más` : ''}</p>
                    </div>
                    <span className="text-slate-400 text-sm shrink-0 ml-2" aria-hidden="true">→</span>
                  </button>
                );
              })}
            </div>
          )}
        </SeccionCard>

        <SeccionCard title={`Historial de servicios (${historial.length})`}>
          {historial.length === 0 ? <p className="text-sm text-slate-400 italic">Sin servicios registrados.</p> : (
            <div className="space-y-2 max-h-80 overflow-y-auto">
              {historial.map(t => {
                const vehiculo = getVehicle(t.vehiculoId);
                const conductor = getDriver(t.conductorId);
                const tipoMeta = TIPO_SERVICIO_META[t.tipoServicio] || null;
                return (
                  <button key={t.id} onClick={() => onOpenTraslado(t.id)} className="w-full text-left flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg border border-slate-200 hover:bg-slate-50 hover:border-slate-300 text-sm transition-colors">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2">
                        <span className="font-mono text-xs text-slate-500">{t.id}</span>
                        {tipoMeta && <span className="text-[11px] text-slate-400">{tipoMeta.icon} {tipoMeta.corto}</span>}
                      </div>
                      <div className="text-xs text-slate-500 truncate">{vehiculo ? `${vehiculo.marca} ${vehiculo.modelo}` : ''}{conductor ? ` · ${conductor.nombre}` : ' · Sin conductor'}</div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <span className="text-slate-500 text-xs">{t.fecha ? formatDayLabel(t.fecha) : '—'}</span>
                      <EstadoPill estado={t.estado} />
                      <span className="text-slate-300" aria-hidden="true">→</span>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </SeccionCard>
      </div>

      {autoAbierto && (
        <AutoDetalleModal
          vehiculoId={autoAbierto}
          onClose={() => setAutoAbierto(null)}
          onAbrirCliente={(id) => { setAutoAbierto(null); if (id !== clienteId) onAbrirCliente(id); }}
        />
      )}
    </div>
  );
}

function NuevoLeadModal({ brand, onCrear, onClose }) {
  const [matricula, setMatricula] = useState('');
  const [telefono, setTelefono] = useState('');
  const [error, setError] = useState('');

  function handleCrear() {
    if (!matricula.trim()) { setError('Introduce la matrícula del vehículo.'); return; }
    onCrear({ matricula: matricula.trim().toUpperCase(), telefono: telefono.trim() });
  }

  const { matches } = useMemo(() => buscarVehiculosPorMatricula(matricula), [matricula]);
  const coincideExistente = matches.some(m => normalizePlate(m.v.matricula) === normalizePlate(matricula));

  return (
    <Modal title="Registrar matrícula para enviar link" onClose={onClose}>
      <p className="text-xs text-slate-500 mb-4">Ingresa la matrícula del vehículo. Generaremos un link para que el propio cliente elija su horario y complete sus datos.</p>
      <Field label="Matrícula del vehículo" error={error}>
        <MatriculaAutocomplete
          value={matricula}
          onChangeText={v => { setMatricula(v); setError(''); }}
          onSelectVehiculo={(id) => setMatricula(VEHICLES[id].matricula)}
          placeholder="Ej. 4521 KTM"
          error={error}
        />
      </Field>
      {matricula.trim().length >= 4 && (
        <p className={`text-xs mb-3 ${coincideExistente ? 'text-emerald-600' : 'text-slate-400'}`}>
          {coincideExistente ? '✓ Coincide con un vehículo ya registrado en el sistema.' : 'Matrícula nueva — si el cliente no coincide, se registrará como nuevo.'}
        </p>
      )}
      <Field label="Teléfono de contacto (opcional)" hint="Solo para referencia interna del taller, no se envía nada realmente en esta demo.">
        <input value={telefono} onChange={e => setTelefono(e.target.value)} className={inputCls(false)} placeholder="Ej. 655 123 456" />
      </Field>
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-100">Cancelar</button>
        <button onClick={handleCrear} className="px-4 py-2 rounded-lg text-white text-sm font-semibold" style={{ backgroundColor: brand.color }}>Registrar matrícula</button>
      </div>
    </Modal>
  );
}

function GestionarLeadModal({ lead, brand, onGenerarLink, onSimularCliente, onClose, onCancelarLead }) {
  const [copiado, setCopiado] = useState(false);
  const link = lead.linkToken ? `https://mecanu.app/agendar/${brand.nombre.toLowerCase().replace(/\s+/g, '-')}/${lead.linkToken}` : null;

  function copiarLink() {
    if (!link) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(() => { setCopiado(true); setTimeout(() => setCopiado(false), 2000); });
    }
  }

  return (
    <Modal title={`Matrícula ${lead.matriculaPreRegistro}`} onClose={onClose}>
      <div className="space-y-4">
        <EstadoPill estado={lead.estado} granular />
        <Timeline events={lead.timeline} />

        {lead.estado === ESTADOS.LEAD && (
          <button onClick={onGenerarLink} className="w-full py-3 rounded-xl text-white text-sm font-semibold" style={{ backgroundColor: brand.color }}>
            🔗 Generar link y marcar como enviado
          </button>
        )}

        {lead.estado === ESTADOS.LINK_ENVIADO && (
          <div className="space-y-3">
            <div>
              <label className="text-xs font-semibold text-slate-500">Link para el cliente</label>
              <div className="flex gap-2 mt-1">
                <input readOnly value={link} className="flex-1 px-3 py-2 rounded-lg border border-slate-300 text-xs font-mono bg-slate-50" />
                <button onClick={copiarLink} className="px-3 py-2 rounded-lg text-white text-xs font-semibold whitespace-nowrap" style={{ backgroundColor: brand.color }}>
                  {copiado ? '✓ Copiado' : 'Copiar'}
                </button>
              </div>
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2.5 text-xs text-amber-700">
              Esperando a que el cliente abra el link y complete su agendamiento. Este panel funciona como tu CRM: el estado cambiará solo cuando el cliente agende.
            </div>
            <button onClick={onSimularCliente} className="w-full py-2.5 rounded-xl text-sm font-semibold border-2 border-dashed border-slate-300 text-slate-600 hover:border-slate-400">
              🎭 Simular vista del cliente (demo)
            </button>
          </div>
        )}

        {(lead.estado === ESTADOS.LEAD || lead.estado === ESTADOS.LINK_ENVIADO) && (
          <button onClick={onCancelarLead} className="w-full py-2 rounded-xl text-xs font-semibold text-red-500 hover:bg-red-50">Cancelar este pre-registro</button>
        )}
      </div>
    </Modal>
  );
}

/* ======================================================================
   CRM — SIMULACIÓN DE LA PÁGINA PÚBLICA DE AUTOAGENDAMIENTO DEL CLIENTE
   ====================================================================== */

function ClienteAutoAgendamiento({ lead, brand, onCompletar, onClose }) {
  const [paso, setPaso] = useState(1);
  const [matriculaIngresada, setMatriculaIngresada] = useState('');
  const [vehiculoEncontrado, setVehiculoEncontrado] = useState(null); // id de vehículo existente si coincide
  const [esClienteAntiguo, setEsClienteAntiguo] = useState(false);
  const [editando, setEditando] = useState(false);

  const [nombre, setNombre] = useState('');
  const [telefono, setTelefono] = useState('');
  const [marca, setMarca] = useState('');
  const [modelo, setModelo] = useState('');
  const [km, setKm] = useState('');

  const [tipoServicio, setTipoServicio] = useState('ida_vuelta');
  const [mismaDireccion, setMismaDireccion] = useState(true);
  const [dirRecogida, setDirRecogida] = useState({ direccion: '', verificada: false, coords: null });
  const [dirEntrega, setDirEntrega] = useState({ direccion: '', verificada: false, coords: null });
  const [fechaRecogida, setFechaRecogida] = useState(dateInputValue(TODAY));
  const [franjaRecogida, setFranjaRecogida] = useState('');
  const [fechaEntrega, setFechaEntrega] = useState(dateInputValue(TODAY));
  const [franjaEntrega, setFranjaEntrega] = useState('');
  const [error, setError] = useState('');

  function confirmarMatricula() {
    const norm = normalizePlate(matriculaIngresada);
    if (!norm) { setError('Introduce tu matrícula.'); return; }
    setError('');
    // Coincide con lo que el taller pre-registró antes de enviar el link?
    const coincidePreRegistro = lead.matriculaPreRegistro && normalizePlate(lead.matriculaPreRegistro) === norm;
    // ¿Existe ya como vehículo en el sistema?
    const entry = Object.entries(VEHICLES).find(([id, v]) => normalizePlate(v.matricula) === norm);

    if (coincidePreRegistro && entry) {
      const [vehId, veh] = entry;
      const principal = getUsuarioPrincipal(vehId);
      setVehiculoEncontrado(vehId);
      setEsClienteAntiguo(true);
      if (principal) {
        setNombre(principal.persona.nombre);
        setTelefono(principal.persona.telefono);
        setDirRecogida({ direccion: principal.persona.direccion, verificada: true, coords: null });
        setDirEntrega({ direccion: principal.persona.direccion, verificada: true, coords: null });
      }
      setMarca(veh.marca); setModelo(veh.modelo); setKm(String(veh.km));
    } else {
      setVehiculoEncontrado(null);
      setEsClienteAntiguo(false);
    }
    setPaso(2);
  }

  function franjasParaFecha(fecha, excluirConductor) {
    return FRANJAS; // el cliente ve todas las franjas; el conductor se asigna después por el taller
  }

  function validarPaso2() {
    if (!nombre.trim()) return 'Introduce tu nombre completo.';
    if (!/^[679]\d{8}$/.test(telefono.replace(/\s/g, ''))) return 'Introduce un teléfono válido (9 dígitos).';
    if (!marca.trim() || !modelo.trim()) return 'Introduce marca y modelo del vehículo.';
    if (tipoServicio !== 'vuelta' && !dirRecogida.direccion.trim()) return 'Introduce la dirección de recogida.';
    if (tipoServicio !== 'ida' && !dirEntrega.direccion.trim()) return 'Introduce la dirección de entrega.';
    if (tipoServicio !== 'vuelta' && !franjaRecogida) return 'Selecciona una franja para la recogida.';
    if (tipoServicio !== 'ida' && !franjaEntrega) return 'Selecciona una franja para la entrega.';
    return '';
  }

  function continuar() {
    const err = validarPaso2();
    if (err) { setError(err); return; }
    setError('');
    setPaso(3);
  }

  function confirmarAgendamiento() {
    onCompletar({
      vehiculoEncontrado, esClienteAntiguo,
      nombre, telefono, marca, modelo, km: Number(km) || 0,
      matricula: matriculaIngresada.trim().toUpperCase(),
      tipoServicio, mismaDireccion,
      direccionRecogida: dirRecogida, direccionEntrega: mismaDireccion ? dirRecogida : dirEntrega,
      fechaRecogida, franjaRecogida, fechaEntrega, franjaEntrega,
    });
  }

  return (
    <Modal title="Agenda tu recogida" onClose={onClose} wide>
      <div className="mb-4 flex items-center gap-2">
        <span className="w-7 h-7 rounded-lg flex items-center justify-center text-sm text-white" style={{ backgroundColor: brand.color }}>{brand.emoji}</span>
        <span className="text-sm font-semibold text-slate-700">{brand.nombre} · Autoagendamiento</span>
        <span className="ml-auto text-[10px] bg-slate-100 text-slate-400 px-2 py-0.5 rounded-md">Vista simulada del cliente</span>
      </div>

      {paso === 1 && (
        <div>
          <p className="text-sm text-slate-600 mb-4">Para empezar, confírmanos la matrícula de tu vehículo.</p>
          <Field label="Matrícula" error={error}>
            <input value={matriculaIngresada} onChange={e => setMatriculaIngresada(e.target.value)} className={inputCls(error)} placeholder="Ej. 4521 KTM" autoFocus />
          </Field>
          <button onClick={confirmarMatricula} className="w-full py-3 rounded-xl text-white text-sm font-semibold mt-2" style={{ backgroundColor: brand.color }}>Continuar</button>
        </div>
      )}

      {paso === 2 && (
        <div>
          {esClienteAntiguo ? (
            <div className="bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2.5 text-xs text-emerald-700 mb-4 flex items-center justify-between">
              <span>✓ Te reconocimos como cliente — completamos tus datos automáticamente.</span>
              <button onClick={() => setEditando(!editando)} className="underline font-semibold whitespace-nowrap ml-2">{editando ? 'Bloquear' : 'Editar'}</button>
            </div>
          ) : (
            <div className="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-xs text-slate-500 mb-4">
              No encontramos esa matrícula asociada a un cliente existente. Completa tus datos manualmente.
            </div>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
            <Field label="Nombre completo">
              <input value={nombre} onChange={e => setNombre(e.target.value)} disabled={esClienteAntiguo && !editando} className={inputCls(false) + (esClienteAntiguo && !editando ? ' bg-slate-100 text-slate-500' : '')} />
            </Field>
            <Field label="Teléfono">
              <input value={telefono} onChange={e => setTelefono(e.target.value)} disabled={esClienteAntiguo && !editando} className={inputCls(false) + (esClienteAntiguo && !editando ? ' bg-slate-100 text-slate-500' : '')} />
            </Field>
            <Field label="Marca">
              {(esClienteAntiguo && !editando) ? (
                <input value={marca} disabled className={inputCls(false) + ' bg-slate-100 text-slate-500'} />
              ) : (
                <ComboBox
                  value={marca}
                  onChange={v => { setMarca(v); if (modelo && !modelosCatalogo(v).some(m => m.toLowerCase() === modelo.toLowerCase())) setModelo(''); }}
                  opciones={marcasCatalogo()}
                  className={inputCls(false)}
                  placeholder="Escribe o elige"
                />
              )}
            </Field>
            <Field label="Modelo">
              {(esClienteAntiguo && !editando) ? (
                <input value={modelo} disabled className={inputCls(false) + ' bg-slate-100 text-slate-500'} />
              ) : (
                <ComboBox value={modelo} onChange={setModelo} opciones={modelosCatalogo(marca)} className={inputCls(false)} placeholder="Escribe o elige" />
              )}
            </Field>
          </div>

          <h4 className="text-sm font-bold text-slate-700 mt-4 mb-2">¿Qué necesitas?</h4>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4">
            {Object.entries(TIPO_SERVICIO_META).map(([key, meta]) => (
              <button key={key} type="button" onClick={() => setTipoServicio(key)}
                className={`px-3 py-2.5 rounded-lg text-xs font-semibold border-2 text-left ${tipoServicio === key ? 'border-transparent text-white' : 'border-slate-200 text-slate-600'}`}
                style={tipoServicio === key ? { backgroundColor: brand.color } : {}}>
                <div>{meta.icon} {meta.corto}</div>
              </button>
            ))}
          </div>

          {tipoServicio === 'ida_vuelta' && (
            <label className="flex items-center gap-2 mb-3 text-xs text-slate-600 cursor-pointer">
              <input type="checkbox" checked={mismaDireccion} onChange={e => setMismaDireccion(e.target.checked)} />
              Usar la misma dirección para recogida y entrega
            </label>
          )}

          {tipoServicio !== 'vuelta' && (
            <Field label="Dirección de recogida">
              <AddressAutocomplete value={dirRecogida.direccion} verificada={dirRecogida.verificada}
                onChange={({ direccion, verificada, coords }) => setDirRecogida({ direccion, verificada, coords })} />
            </Field>
          )}
          {tipoServicio !== 'ida' && !(tipoServicio === 'ida_vuelta' && mismaDireccion) && (
            <Field label="Dirección de entrega">
              <AddressAutocomplete value={dirEntrega.direccion} verificada={dirEntrega.verificada}
                onChange={({ direccion, verificada, coords }) => setDirEntrega({ direccion, verificada, coords })} />
            </Field>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
            {tipoServicio !== 'vuelta' && (
              <div>
                <Field label="Fecha de recogida">
                  <input type="date" min={dateInputValue(TODAY)} value={fechaRecogida} onChange={e => setFechaRecogida(e.target.value)} className={inputCls(false)} />
                </Field>
                <Field label="Franja de recogida">
                  <div className="grid grid-cols-2 gap-1.5">
                    {franjasParaFecha(fechaRecogida).map(f => (
                      <button key={f} type="button" onClick={() => setFranjaRecogida(f)}
                        className={`px-2 py-1.5 rounded-lg text-[11px] font-medium border ${franjaRecogida === f ? 'text-white border-transparent' : 'bg-white text-slate-600 border-slate-300'}`}
                        style={franjaRecogida === f ? { backgroundColor: brand.color } : {}}>{f}</button>
                    ))}
                  </div>
                </Field>
              </div>
            )}
            {tipoServicio !== 'ida' && (
              <div>
                <Field label="Fecha de entrega">
                  <input type="date" min={fechaRecogida} value={fechaEntrega} onChange={e => setFechaEntrega(e.target.value)} className={inputCls(false)} />
                </Field>
                <Field label="Franja de entrega">
                  <div className="grid grid-cols-2 gap-1.5">
                    {franjasParaFecha(fechaEntrega).map(f => (
                      <button key={f} type="button" onClick={() => setFranjaEntrega(f)}
                        className={`px-2 py-1.5 rounded-lg text-[11px] font-medium border ${franjaEntrega === f ? 'text-white border-transparent' : 'bg-white text-slate-600 border-slate-300'}`}
                        style={franjaEntrega === f ? { backgroundColor: brand.color } : {}}>{f}</button>
                    ))}
                  </div>
                </Field>
              </div>
            )}
          </div>

          {error && <p className="text-xs text-red-600 mb-2">{error}</p>}
          <div className="flex justify-between mt-2">
            <button onClick={() => setPaso(1)} className="px-4 py-2 rounded-lg text-sm font-semibold text-slate-500">← Atrás</button>
            <button onClick={continuar} className="px-5 py-2.5 rounded-xl text-white text-sm font-semibold" style={{ backgroundColor: brand.color }}>Revisar y confirmar</button>
          </div>
        </div>
      )}

      {paso === 3 && (
        <div>
          <h4 className="text-sm font-bold text-slate-700 mb-3">Confirma tu agendamiento</h4>
          <div className="bg-slate-50 rounded-lg p-4 text-sm space-y-1.5 mb-4">
            <DatoLinea label="Cliente" value={nombre} />
            <DatoLinea label="Vehículo" value={`${marca} ${modelo} · ${matriculaIngresada.toUpperCase()}`} />
            <DatoLinea label="Servicio" value={TIPO_SERVICIO_META[tipoServicio].label} />
            {tipoServicio !== 'vuelta' && <DatoLinea label="Recogida" value={`${formatDayLabel(new Date(fechaRecogida))} · ${franjaRecogida}`} />}
            {tipoServicio !== 'ida' && <DatoLinea label="Entrega" value={`${formatDayLabel(new Date(fechaEntrega))} · ${franjaEntrega}`} />}
          </div>
          <div className="flex justify-between">
            <button onClick={() => setPaso(2)} className="px-4 py-2 rounded-lg text-sm font-semibold text-slate-500">← Editar</button>
            <button onClick={confirmarAgendamiento} className="px-5 py-2.5 rounded-xl text-white text-sm font-semibold" style={{ backgroundColor: brand.color }}>✓ Confirmar agendamiento</button>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* ======================================================================
   TRANSICIONES DE ESTADO DEL TRASLADO (máquina de estados del conductor)
   ====================================================================== */

function transIniciarRecogida(t) {
  return { ...t, estado: ESTADOS.CAMINO_RECOGIDA, timeline: [...t.timeline, ev('Conductor salió hacia el domicilio del cliente', new Date())] };
}
function transLlegadaRecogida(t) {
  return { ...t, estado: ESTADOS.EN_DOMICILIO_RECOGIDA, timeline: [...t.timeline, ev('Llegada al domicilio del cliente', new Date())] };
}
function transSubmitCheckin(t, data) {
  const now = new Date();
  return { ...t, estado: ESTADOS.CAMINO_TALLER, checkin: data, timeline: [...t.timeline, ev('Checkin completado', now), ev('Salida hacia el taller', now)] };
}
function transLlegadaTaller(t) {
  return { ...t, estado: ESTADOS.EN_TALLER, timeline: [...t.timeline, ev('Llegada al taller', new Date())] };
}
function transFinalizarServicio(t) {
  const now = new Date();
  return { ...t, estado: ESTADOS.CAMINO_ENTREGA, timeline: [...t.timeline, ev('Servicio finalizado en taller', now), ev('Salida del taller hacia el domicilio del cliente', now)] };
}
function transLlegadaEntrega(t) {
  return { ...t, estado: ESTADOS.EN_DOMICILIO_ENTREGA, timeline: [...t.timeline, ev('Llegada al domicilio del cliente', new Date())] };
}
function transSubmitCheckout(t, data) {
  const now = new Date();
  return { ...t, estado: ESTADOS.ENTREGADO, checkout: data, timeline: [...t.timeline, ev('Checkout completado', now), ev('Traslado entregado', now)] };
}
// Servicio "solo entrega": el vehículo ya está en el taller por otra vía, se salta directo a la entrega
function transIniciarSoloEntrega(t) {
  return { ...t, estado: ESTADOS.CAMINO_ENTREGA, timeline: [...t.timeline, ev('Vehículo recogido en el taller — conductor salió hacia la entrega', new Date())] };
}
// Servicio "solo recogida": termina al dejar el coche en el taller, sin entrega de vuelta
function transCompletarSoloRecogida(t) {
  return { ...t, estado: ESTADOS.ENTREGADO, timeline: [...t.timeline, ev('Vehículo dejado en el taller — traslado de recogida completado', new Date())] };
}

// --- Transiciones del pipeline CRM de agendamiento por link ---
function transGenerarLink(t) {
  const now = new Date();
  const token = generateLinkToken();
  return { ...t, estado: ESTADOS.LINK_ENVIADO, linkToken: token, linkEnviadoEn: now, timeline: [...t.timeline, ev('Link de autoagendamiento generado y enviado al cliente', now)] };
}
function transCancelarLead(t) {
  return { ...t, estado: ESTADOS.CANCELADO, timeline: [...t.timeline, ev('Pre-registro cancelado por el taller', new Date())] };
}

function dateConFranja(fechaStr, franja) {
  if (!fechaStr) return null;
  const [y, m, d] = fechaStr.split('-').map(Number);
  const hh = franja ? parseFranja(franja).start : 9;
  return new Date(y, m - 1, d, hh, 0, 0, 0);
}

// El cliente completa su autoagendamiento vía link: el "lead" se convierte en un traslado agendado completo.
function transClienteCompletaAgendamiento(lead, datos) {
  const now = new Date();
  let vehiculoId = datos.vehiculoEncontrado;
  let clienteId = null;
  const nombreFmt = toTitleCase(datos.nombre.trim());

  if (vehiculoId) {
    const principal = getUsuarioPrincipal(vehiculoId);
    clienteId = principal ? principal.clienteId : null;
    if (clienteId) {
      const persona = getClient(clienteId);
      persona.nombre = nombreFmt;
      persona.telefono = datos.telefono.trim();
    }
  }
  if (!clienteId) {
    clienteId = uid('c').toLowerCase();
    CLIENTS.push({ id: clienteId, nombre: nombreFmt, telefono: datos.telefono.trim(), direccion: datos.direccionRecogida.direccion || datos.direccionEntrega.direccion || '', clienteDesde: now });
  }
  if (!vehiculoId) {
    vehiculoId = uid('v').toLowerCase();
    registrarEnCatalogo(datos.marca, datos.modelo);
    VEHICLES[vehiculoId] = { marca: toTitleCase(datos.marca.trim()), modelo: toTitleCase(datos.modelo.trim()), anio: new Date().getFullYear(), matricula: datos.matricula, km: datos.km, color: 'No especificado', usuarios: [{ clienteId, relacion: 'Titular', esPrincipal: true }] };
  }

  const franjaRecogida = datos.tipoServicio !== 'vuelta' ? datos.franjaRecogida : null;
  const franjaEntrega = datos.tipoServicio !== 'ida' ? datos.franjaEntrega : null;
  const fechaRecogidaDate = datos.tipoServicio !== 'vuelta' ? dateConFranja(datos.fechaRecogida, franjaRecogida) : null;
  const fechaEntregaDate = datos.tipoServicio !== 'ida' ? dateConFranja(datos.fechaEntrega, franjaEntrega) : null;

  return {
    ...lead,
    estado: ESTADOS.AGENDADO,
    clienteId, vehiculoId, usuarioContactoId: clienteId, conductorId: null,
    tipoServicio: datos.tipoServicio, seguro: false,
    direccionRecogida: datos.direccionRecogida.direccion || null,
    direccionRecogidaVerificada: !!datos.direccionRecogida.verificada,
    direccionEntrega: datos.direccionEntrega.direccion || null,
    direccionEntregaVerificada: !!datos.direccionEntrega.verificada,
    fechaRecogida: fechaRecogidaDate, franjaRecogida,
    fechaEntrega: fechaEntregaDate, franjaEntrega,
    fecha: fechaRecogidaDate || fechaEntregaDate,
    franja: franjaRecogida || franjaEntrega,
    matriculaPreRegistro: datos.matricula,
    timeline: [...lead.timeline, ev(`Cliente completó el autoagendamiento (${datos.esClienteAntiguo ? 'reconocido como cliente existente' : 'registrado como cliente nuevo'})`, now)],
  };
}

/* ======================================================================
   APP CONDUCTOR — SIMULADOR DE TRACKING EN VIVO
   ====================================================================== */

function TrackingSimulator({ destino, brand, onArrive }) {
  const [progreso, setProgreso] = useState(2);
  const [logs, setLogs] = useState([{ text: `Conductor en camino hacia ${destino}.`, time: new Date() }]);
  const milestonesRef = useRef(new Set());
  const arrivedRef = useRef(false);

  useEffect(() => {
    const timer = setInterval(() => {
      setProgreso(p => (p >= 100 ? p : Math.min(100, p + 14 + Math.floor(Math.random() * 10))));
    }, 1500);
    return () => clearInterval(timer);
  }, []);

  useEffect(() => {
    const thresholds = [
      [30, 'En tránsito, tráfico fluido.'],
      [60, 'A mitad de camino, todo en orden.'],
      [88, `Aproximándose a ${destino}.`],
      [100, `Conductor llegó a ${destino}.`],
    ];
    thresholds.forEach(([th, msg]) => {
      if (progreso >= th && !milestonesRef.current.has(th)) {
        milestonesRef.current.add(th);
        setLogs(l => [...l, { text: msg, time: new Date() }]);
        if (th === 100 && !arrivedRef.current) {
          arrivedRef.current = true;
          setTimeout(() => onArrive(), 600);
        }
      }
    });
  }, [progreso]);

  function avanzarManual() {
    setProgreso(p => Math.min(100, p + 34));
  }

  const pasos = ['Salió', 'En tránsito', 'Llegando', 'Llegó'];
  const pasoActivo = progreso >= 100 ? 3 : progreso >= 88 ? 2 : progreso >= 30 ? 1 : 0;

  return (
    <div>
      <div className="bg-white rounded-2xl border border-slate-200 p-4 mb-3">
        <p className="text-xs text-slate-400 mb-1">Destino</p>
        <p className="text-sm font-semibold text-slate-800 mb-3">{destino}</p>
        <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden mb-3">
          <div className="h-full rounded-full transition-all duration-500" style={{ width: `${progreso}%`, backgroundColor: brand.color }} />
        </div>
        <div className="flex justify-between text-[11px] text-slate-400 mb-1">
          {pasos.map((p, i) => (
            <span key={p} className={i <= pasoActivo ? 'font-semibold' : ''} style={i <= pasoActivo ? { color: brand.color } : {}}>{p}</span>
          ))}
        </div>
        <p className="text-xs text-slate-400">{progreso}% completado</p>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-4 mb-3 max-h-40 overflow-y-auto">
        <p className="text-xs font-semibold text-slate-500 mb-2">Registro de eventos</p>
        <div className="space-y-1.5">
          {[...logs].reverse().map((l, i) => (
            <p key={i} className="text-xs text-slate-600"><span className="text-slate-400 font-mono">{formatTime(l.time)}</span> — {l.text}</p>
          ))}
        </div>
      </div>

      {progreso < 100 && (
        <button onClick={avanzarManual} className="w-full py-2.5 rounded-xl text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">
          Avanzar tramo (demo) ⏩
        </button>
      )}
    </div>
  );
}

function VoiceRecorder({ value, onChange }) {
  const [grabando, setGrabando] = useState(false);
  const [duracion, setDuracion] = useState(0);
  const [error, setError] = useState('');
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);
  const timerRef = useRef(null);

  async function iniciar() {
    setError('');
    if (!navigator.mediaDevices || !window.MediaRecorder) { setError('Este navegador no soporta grabación de audio.'); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mr = new MediaRecorder(stream);
      chunksRef.current = [];
      let segundos = 0;
      mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
        onChange({ url: URL.createObjectURL(blob), duracion: segundos });
        stream.getTracks().forEach(tr => tr.stop());
      };
      mr.start();
      mediaRecorderRef.current = mr;
      setGrabando(true);
      setDuracion(0);
      timerRef.current = setInterval(() => { segundos += 1; setDuracion(segundos); }, 1000);
    } catch (e) {
      setError('No se pudo acceder al micrófono (permiso denegado o no disponible).');
    }
  }
  function detener() {
    if (mediaRecorderRef.current) mediaRecorderRef.current.stop();
    setGrabando(false);
    clearInterval(timerRef.current);
  }

  return (
    <div className="bg-slate-50 rounded-lg p-3">
      <div className="flex items-center gap-2 flex-wrap">
        {!grabando ? (
          <button type="button" onClick={iniciar} className="px-3 py-1.5 rounded-lg bg-red-500 text-white text-xs font-semibold">🎙️ Grabar nota de voz</button>
        ) : (
          <button type="button" onClick={detener} className="px-3 py-1.5 rounded-lg bg-slate-800 text-white text-xs font-semibold">⏹ Detener ({duracion}s)</button>
        )}
        {value && !grabando && (
          <>
            <audio controls src={value.url} className="h-8 max-w-[180px]" />
            <button type="button" onClick={() => onChange(null)} className="text-xs text-slate-400 underline">Borrar</button>
          </>
        )}
      </div>
      {error && <p className="text-xs text-red-500 mt-1">{error}</p>}
      <p className="text-[11px] text-slate-400 mt-1">Graba con el micrófono real del dispositivo (requiere permiso del navegador).</p>
    </div>
  );
}

function itvEstadoInfo(fechaStr) {
  if (!fechaStr) return null;
  const dias = (new Date(fechaStr) - TODAY) / 86400000;
  if (dias < 0) return { label: 'Vencida', color: '#DC2626' };
  if (dias < 30) return { label: 'Por vencer', color: '#D97706' };
  return { label: 'Vigente', color: '#15803D' };
}

          <EstadoPill estado={t.estado} granular />

  return (
    <div className="p-4 pb-24">
      <div className="mb-4">

        <h1 className="text-lg font-bold text-slate-800">Hola, {driver.nombre.split(' ')[0]} 👋</h1>

        </div>
      )}

      <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Hoy · {hoy.length}</p>
      {hoy.length === 0 && <p className="text-sm text-slate-400 italic mb-4">Sin traslados asignados hoy.</p>}
      {hoy.map(t => <TrasladoCard key={t.id} t={t} />)}

      {proximos.length > 0 && (
        <>
          <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2 mt-5">Próximos</p>
          {proximos.map(t => <TrasladoCard key={t.id} t={t} />)}

      {completados.length > 0 && (
        <>
          <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2 mt-5">Historial reciente</p>
          {completados.map(t => <TrasladoCard key={t.id} t={t} />)}

function ConductorDetalle({ traslado, brand, onBack, onUpdate }) {
  if (!traslado) return null;
  const vehiculo = getVehicle(traslado.vehiculoId);
  const soloRecogida = traslado.tipoServicio === 'ida';
  const soloEntrega = traslado.tipoServicio === 'vuelta';

  function renderAccion() {
    switch (traslado.estado) {
      case ESTADOS.AGENDADO:
        return (
          <div>
            <div className="bg-white rounded-2xl border border-slate-200 p-4 mb-3 text-center">
              <p className="text-sm text-slate-500 mb-1">Traslado agendado para</p>
              <p className="text-lg font-bold text-slate-800">{traslado.franja}</p>
            </div>
            {soloEntrega ? (
              <button onClick={() => onUpdate(transIniciarSoloEntrega)} className="w-full py-3 rounded-xl text-white text-sm font-semibold shadow-sm" style={{ backgroundColor: brand.color }}>
                Recoger vehículo en el taller e iniciar entrega
              </button>
            ) : (
              <button onClick={() => onUpdate(transIniciarRecogida)} className="w-full py-3 rounded-xl text-white text-sm font-semibold shadow-sm" style={{ backgroundColor: brand.color }}>
                Iniciar recogida del vehículo
              </button>
            )}
          </div>
        );
      case ESTADOS.CAMINO_RECOGIDA:
        return <TrackingSimulator destino="el domicilio del cliente" brand={brand} onArrive={() => onUpdate(transLlegadaRecogida)} />;
      case ESTADOS.EN_DOMICILIO_RECOGIDA:
        return (
          <div>
            <div className="bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-xl px-3 py-2.5 mb-3">
              Has llegado al domicilio del cliente. Completa el checkin antes de salir hacia el taller.
            </div>
            <CheckinForm vehiculo={vehiculo} brand={brand} onSubmit={(data) => onUpdate(t => transSubmitCheckin(t, data))} />
          </div>
        );
      case ESTADOS.CAMINO_TALLER:
        return <TrackingSimulator destino="el taller" brand={brand} onArrive={() => onUpdate(transLlegadaTaller)} />;
      case ESTADOS.EN_TALLER:
        return soloRecogida ? (
          <div className="bg-white rounded-2xl border border-slate-200 p-5 text-center">
            <p className="text-3xl mb-2">✅</p>
            <p className="text-sm font-semibold text-slate-800 mb-1">Vehículo dejado en el taller</p>
            <p className="text-xs text-slate-500 mb-4">Este servicio era solo de recogida — no requiere entrega de vuelta.</p>
            <button onClick={() => onUpdate(transCompletarSoloRecogida)} className="w-full py-3 rounded-xl text-white text-sm font-semibold shadow-sm" style={{ backgroundColor: brand.color }}>
              Marcar traslado como completado
            </button>
          </div>
        ) : (
          <div className="bg-white rounded-2xl border border-slate-200 p-5 text-center">
            <p className="text-3xl mb-2">🔧</p>
            <p className="text-sm font-semibold text-slate-800 mb-1">Vehículo en el taller</p>
            <p className="text-xs text-slate-500 mb-4">A la espera de que el taller finalice el servicio mecánico.</p>
            <button onClick={() => onUpdate(transFinalizarServicio)} className="w-full py-3 rounded-xl text-white text-sm font-semibold shadow-sm" style={{ backgroundColor: brand.color }}>
              Servicio finalizado — iniciar entrega
            </button>
          </div>
        );
      case ESTADOS.CAMINO_ENTREGA:
        return <TrackingSimulator destino="el domicilio del cliente" brand={brand} onArrive={() => onUpdate(transLlegadaEntrega)} />;
      case ESTADOS.EN_DOMICILIO_ENTREGA:
        return (
          <div>
            <div className="bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-xl px-3 py-2.5 mb-3">
              Has llegado al domicilio del cliente. Completa el checkout para finalizar el traslado.
            </div>
            <CheckoutForm brand={brand} onSubmit={(data) => onUpdate(t => transSubmitCheckout(t, data))} />
          </div>
        );
      case ESTADOS.ENTREGADO:
        return (
          <div className="bg-white rounded-2xl border border-slate-200 p-5 text-center">
            <p className="text-3xl mb-2">✅</p>
            <p className="text-sm font-semibold text-slate-800">Traslado completado</p>
            <p className="text-xs text-slate-500 mt-1">Checkin y checkout registrados correctamente.</p>
          </div>
        );
      default:
        return null;
    }
  }

  return (
    <div className="p-4 pb-24">
      <button onClick={onBack} className="text-sm text-slate-500 mb-3 inline-flex items-center gap-1">← Mis traslados</button>
      <div className="flex items-center justify-between mb-3">
        <span className="font-mono text-xs text-slate-400">{traslado.id}</span>
        <EstadoPill estado={traslado.estado} granular />
      </div>
      <InfoCard traslado={traslado} />
      {renderAccion()}
    </div>
  );
}

function App() {
  const [traslados, setTraslados] = useState(TRASLADOS_INICIALES);
  const [brand, setBrand] = useState(BRAND_DEFAULT);
  const [modo, setModo] = useState('taller');

  // Pila de navegación del panel del taller: permite que "volver" regrese siempre
  // a la pantalla real anterior (no siempre al dashboard).
  const [navStack, setNavStack] = useState([{ screen: 'dashboard' }]);
  const [drawer, setDrawer] = useState({ type: null, id: null, open: false });
  const openDrawer = (type, id) => setDrawer({ type, id, open: true });
  const closeDrawer = () => setDrawer({ type: null, id: null, open: false });
  const current = navStack[navStack.length - 1];
  function goTo(screen, extra) { setNavStack(prev => [...prev, { screen, ...extra }]); }
  function goBack() { setNavStack(prev => prev.length > 1 ? prev.slice(0, -1) : prev); }
  function resetTo(screen, extra) { setNavStack([{ screen, ...extra }]); }

  const [driverActualId, setDriverActualId] = useState('d1');
  const [pantallaConductor, setPantallaConductor] = useState('lista');
  const [selectedConductorTrasladoId, setSelectedConductorTrasladoId] = useState(null);

  // DRIVERS es una "base de datos" mutable en memoria (igual que CLIENTS/VEHICLES). Este contador fuerza
  // un re-render cuando se muta directamente (alta de conductor, avance del proceso de selección, etc.).
  const [driversVersion, setDriversVersion] = useState(0);
  function bumpDrivers() { setDriversVersion(v => v + 1); }

  const [toasts, setToasts] = useState([]);

  // Modales del pipeline CRM de agendamiento por link
  const [showNuevoLead, setShowNuevoLead] = useState(false);
  const [gestionandoLeadId, setGestionandoLeadId] = useState(null);
  const [simulandoLeadId, setSimulandoLeadId] = useState(null);

  function addToast(message) {
    const id = uid('toast');
    setToasts(prev => [...prev, { id, message }]);
    setTimeout(() => setToasts(prev => prev.filter(x => x.id !== id)), 4200);
  }

  function updateTraslado(id, updater) {
    setTraslados(prev => prev.map(t => t.id === id ? updater(t) : t));
  }

  function handleOpenTraslado(id) {
    goTo('detalle', { trasladoId: id });
  }

  function handleCrearTraslado(nuevo) {
    setTraslados(prev => [...prev, nuevo]);
    addToast(`Traslado ${nuevo.id} agendado ${nuevo.fecha ? `para ${formatDayLabel(nuevo.fecha)} · ${nuevo.franja}` : ''}.`);
    resetTo('dashboard');
    goTo('detalle', { trasladoId: nuevo.id });
  }

  // --- CRM: pipeline de agendamiento por link ---
  function handleCrearLead({ matricula, telefono }) {
    const nuevoId = 'TR-LEAD-' + Math.floor(Math.random() * 9000 + 1000);
    const nuevo = {
      id: nuevoId, estado: ESTADOS.LEAD, matriculaPreRegistro: matricula,
      clienteId: null, vehiculoId: null, conductorId: null, usuarioContactoId: null,
      tipoServicio: null, seguro: false,
      direccionRecogida: null, direccionEntrega: null, direccionRecogidaVerificada: false, direccionEntregaVerificada: false,
      fecha: null, franja: null, fechaRecogida: null, franjaRecogida: null, fechaEntrega: null, franjaEntrega: null,
      linkToken: null, linkEnviadoEn: null,
      timeline: [ev(`Matrícula registrada por el taller${telefono ? ` (contacto: ${telefono})` : ''}`, new Date())],
      checkin: null, checkout: null,
    };
    setTraslados(prev => [...prev, nuevo]);
    setShowNuevoLead(false);
    addToast(`Matrícula ${matricula} registrada. Ya puedes generar y enviar el link.`);
    setGestionandoLeadId(nuevoId);
  }
  function handleGenerarLink() {
    updateTraslado(gestionandoLeadId, transGenerarLink);
    addToast('Link generado y marcado como enviado.');
  }
  function handleCancelarLead() {
    updateTraslado(gestionandoLeadId, transCancelarLead);
    setGestionandoLeadId(null);
    addToast('Pre-registro cancelado.');
  }
  function handleSimularCliente() {
    setSimulandoLeadId(gestionandoLeadId);
    setGestionandoLeadId(null);
  }
  function handleClienteCompleta(datos) {
    const leadId = simulandoLeadId;
    setTraslados(prev => prev.map(t => t.id === leadId ? transClienteCompletaAgendamiento(t, datos) : t));
    setSimulandoLeadId(null);
    addToast('¡El cliente completó su autoagendamiento! Ya puedes asignarle un conductor.');
    resetTo('dashboard');
    goTo('detalle', { trasladoId: leadId });
  }

  // --- Alta de conductores (mini ATS/HR): registro, avance de supervisión y activación ---
  function handleRegistrarConductor(datos) {
    const id = uid('d').toLowerCase();
    const docsCompletos = !!(datos.fotoId && datos.fotoLicencia && datos.iban.trim());
    DRIVERS.push({
      id, nombre: toTitleCase(datos.nombre.trim()),
      iniciales: datos.nombre.trim().split(/\s+/).slice(0, 2).map(p => p[0].toUpperCase()).join(''),
      telefono: datos.telefono.trim(), vehiculo: 'Sin asignar (nuevo alta)', descansoHoy: false,
      ingreso: new Date(), calificacion: 0, totalCalificaciones: 0, incidentes: [],
      procesoEstado: docsCompletos ? 'en_supervision' : 'documentos_pendientes',
      serviciosSupervisados: 0, serviciosRequeridos: 3,
      documentos: { fotoId: datos.fotoId, fotoLicencia: datos.fotoLicencia, iban: datos.iban.trim() },
      valoraciones: [],
    });
    bumpDrivers();
    addToast(`${toTitleCase(datos.nombre.trim())} registrado en el proceso de selección.`);
  }
  function handleAvanzarSupervision(driverId) {
    const d = getDriver(driverId);
    if (!d || d.procesoEstado === 'activo') return;
    d.serviciosSupervisados = Math.min(d.serviciosRequeridos, d.serviciosSupervisados + 1);
    if (d.serviciosSupervisados >= d.serviciosRequeridos) {
      // ya puede pasar a "listo para dar de alta"; la activación final es una acción explícita del taller.
    }
    bumpDrivers();
    addToast(`Servicio supervisado registrado (${d.serviciosSupervisados}/${d.serviciosRequeridos}) para ${d.nombre}.`);
  }
  function handleDarDeAlta(driverId) {
    const d = getDriver(driverId);
    if (!d || d.serviciosSupervisados < d.serviciosRequeridos) return;
    d.procesoEstado = 'activo';
    bumpDrivers();
    addToast(`${d.nombre} ha sido dado de alta. Ya puede operar servicios en solitario.`);
  }
  function handleCompletarDocumentos(driverId, datos) {
    const d = getDriver(driverId);
    if (!d) return;
    d.documentos = { ...d.documentos, ...datos };
    if (d.documentos.fotoId && d.documentos.fotoLicencia && d.documentos.iban && d.documentos.iban.trim() && d.procesoEstado === 'documentos_pendientes') {
      d.procesoEstado = 'en_supervision';
    }
    bumpDrivers();
    addToast('Documentación actualizada.');
  }

  // --- Asignación inline de conductor + cambios manuales de estado (kanban) ---
  function handleAsignarConductor(trasladoId, conductorId) {
    updateTraslado(trasladoId, t => ({
      ...t, conductorId,
      timeline: [...t.timeline, ev(conductorId ? `Conductor asignado: ${getDriver(conductorId).nombre}` : 'Conductor desasignado', new Date())],
    }));
    addToast(conductorId ? 'Conductor asignado correctamente.' : 'Conductor desasignado.');
  }
  function handleCambiarEstadoManual(trasladoId, bucketDestino) {
    if (!BUCKET_TO_GRANULAR[bucketDestino]) return; // no se puede arrastrar a lead/link_enviado manualmente
    const actual = traslados.find(t => t.id === trasladoId);
    if (!actual || bucketEstado(actual.estado) === bucketDestino) return;
    updateTraslado(trasladoId, t => ({
      ...t, estado: BUCKET_TO_GRANULAR[bucketDestino],
      timeline: [...t.timeline, ev(`Estado actualizado manualmente por el taller a: ${BUCKET_META[bucketDestino].label}`, new Date())],
    }));
    addToast(`Estado actualizado a "${BUCKET_META[bucketDestino].label}".`);
  }

  const TOAST_POR_ESTADO = {
    camino_recogida: 'Recogida iniciada — ubicación en vivo activada.',
    en_domicilio_recogida: 'El conductor llegó al domicilio del cliente.',
    camino_taller: 'Checkin guardado. En camino al taller.',
    en_taller: 'El vehículo llegó al taller.',
    camino_entrega: 'Servicio finalizado. Saliendo hacia la entrega.',
    en_domicilio_entrega: 'El conductor llegó para la entrega.',
    entregado: 'Checkout guardado. Traslado entregado con éxito.',
  };

  function handleConductorUpdate(updaterFn) {
    const actual = traslados.find(t => t.id === selectedConductorTrasladoId);
    if (!actual) return;
    const nuevo = updaterFn(actual);
    setTraslados(prev => prev.map(t => t.id === selectedConductorTrasladoId ? nuevo : t));
    if (TOAST_POR_ESTADO[nuevo.estado]) addToast(TOAST_POR_ESTADO[nuevo.estado]);
  }

  const trasladoSeleccionado = current.trasladoId ? (traslados.find(t => t.id === current.trasladoId) || null) : null;
  const leadGestionando = gestionandoLeadId ? traslados.find(t => t.id === gestionandoLeadId) : null;
  const leadSimulando = simulandoLeadId ? traslados.find(t => t.id === simulandoLeadId) : null;

  function irSidebar(key) { resetTo(key); }

  return (
    <div className="min-h-screen">
      <TopBar modo={modo} setModo={setModo} brand={brand} />

      {modo === 'taller' ? (
        <div className="flex">
          <Sidebar pantalla={current.screen} setPantalla={irSidebar} brand={brand} />
          <main className="flex-1 p-4 sm:p-6 max-w-7xl mx-auto w-full">
            {current.screen === 'dashboard' && (
              <TallerDashboard
                traslados={traslados}
                brand={brand}
                onOpenTraslado={handleOpenTraslado}
                onNuevoTraslado={() => goTo('nuevo')}
                onNuevoLead={() => setShowNuevoLead(true)}
                onAbrirLead={setGestionandoLeadId}
                onAsignarConductor={handleAsignarConductor}
                onCambiarEstadoManual={handleCambiarEstadoManual}
              />
            )}
            {current.screen === 'detalle' && (
              <TallerDetalleTraslado
                traslado={trasladoSeleccionado}
                traslados={traslados}
                brand={brand}
                onBack={goBack}
                onOpenTraslado={handleOpenTraslado}
              />
            )}
            {current.screen === 'nuevo' && (
              <TallerNuevoTraslado
                traslados={traslados}
                brand={brand}
                onBack={goBack}
                onCrear={handleCrearTraslado}
              />
            )}
            {current.screen === 'conductores' && (
              <TallerConductores
                traslados={traslados} brand={brand} driversVersion={driversVersion}
                onAbrirConductor={(id) => goTo('conductorDetalle', { driverId: id })}
                onCrearConductor={handleRegistrarConductor}
              />
            )}
            {current.screen === 'conductorDetalle' && (
              <TallerConductorDetalle
                driverId={current.driverId} traslados={traslados} brand={brand} onBack={goBack}
                onAvanzarSupervision={handleAvanzarSupervision}
                onDarDeAlta={handleDarDeAlta}
                onCompletarDocumentos={handleCompletarDocumentos}
              />
            )}
            {current.screen === 'clientes' && (
              <TallerClientes traslados={traslados} brand={brand} onAbrirCliente={(id) => goTo('clienteDetalle', { clienteId: id })} />
            )}
            {current.screen === 'clienteDetalle' && (
              <TallerClienteDetalle
                clienteId={current.clienteId} traslados={traslados} brand={brand} onBack={goBack}
                onOpenTraslado={handleOpenTraslado}
                onAbrirCliente={(id) => goTo('clienteDetalle', { clienteId: id })}
              />
            )}
            {current.screen === 'config' && (
              <TallerConfiguracion brand={brand} onChange={setBrand} />
            )}
          </main>
        </div>
      ) : (
        <ConductorShell
          brand={brand}
          traslados={traslados}
          driverActualId={driverActualId}
          setDriverActualId={setDriverActualId}
          pantallaConductor={pantallaConductor}
          setPantallaConductor={setPantallaConductor}
          selectedId={selectedConductorTrasladoId}
          setSelectedId={setSelectedConductorTrasladoId}
          onUpdate={handleConductorUpdate}
        />
      )}

      {showNuevoLead && (
        <NuevoLeadModal brand={brand} onCrear={handleCrearLead} onClose={() => setShowNuevoLead(false)} />
      )}
      {leadGestionando && (
        <GestionarLeadModal
          lead={leadGestionando} brand={brand}
          onGenerarLink={handleGenerarLink}
          onSimularCliente={handleSimularCliente}
          onCancelarLead={handleCancelarLead}
          onClose={() => setGestionandoLeadId(null)}
        />
      )}
      {leadSimulando && (
        <ClienteAutoAgendamiento
          lead={leadSimulando} brand={brand}
          onCompletar={handleClienteCompleta}
          onClose={() => setSimulandoLeadId(null)}
        />
      )}

      <ToastHost toasts={toasts} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
(function() {
  try {
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof Babel === 'undefined') {
      throw new Error('No se pudieron cargar React/Babel desde el CDN. Revisa tu conexión a internet.');
    }
    var src = document.getElementById('app-source').textContent;
    var compiled = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(compiled);
  } catch (err) {
    console.error('Error al iniciar la demo de Mecanu:', err);
    var box = document.getElementById('fatal-error');
    box.style.display = 'block';
    var p = box.querySelector('p');
    p.textContent = 'Detalle técnico: ' + (err && err.message ? err.message : err);
  }
})();
</script>
</body>
</html>
