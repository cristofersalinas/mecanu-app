function atTime(hh, mm, dayOffset = 0) {
  const d = new Date(TODAY);
  d.setDate(d.getDate() + dayOffset);
  d.setHours(hh, mm, 0, 0);
  return d;
}
function sameDay(a, b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function formatTime(d) {
  return d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });

function formatDayLabel(d) {
  if (sameDay(d, TODAY)) return 'Hoy';
  const yest = new Date(TODAY); yest.setDate(yest.getDate()-1);
  const tom = new Date(TODAY); tom.setDate(tom.getDate()+1);
  if (sameDay(d, yest)) return 'Ayer';
  if (sameDay(d, tom)) return 'Mañana';
  return d.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' });

/* ======================================================================
   BÚSQUEDA INTELIGENTE: normalización de matrícula + fuzzy matching

// Ignora espacios, guiones y mayúsculas/minúsculas para comparar matrículas
function normalizePlate(s) {
  return (s || '').toUpperCase().replace(/[\s-]/g, '');
}

// Distancia de Levenshtein (nº mínimo de ediciones para pasar de a a b) — base del "quisiste decir..."
function levenshtein(a, b) {
  a = a || ''; b = b || '';
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}

// Puntúa qué tan bien "query" coincide con "target": 1 = coincidencia perfecta, 0 = sin relación.
// Compara también contra cada palabra del target por separado (para que un typo en el apellido,
// ej. "Roiz"/"Ruis", encuentre "Ruiz" dentro de "María Dolores Ruiz Campos").
function fuzzyScore(query, target) {
  const q = (query || '').toLowerCase().trim();
  const full = (target || '').toLowerCase().trim();
  if (!q || !full) return 0;
  if (full.includes(q)) return 1 - Math.max(0, (full.length - q.length) / 40);
  const palabras = full.split(/\s+/).filter(Boolean);
  let mejor = 0;
  palabras.forEach(w => {
    if (w.length < 3) return;
    if (w.includes(q) || q.includes(w)) { mejor = Math.max(mejor, 0.9); return; }
    const dist = levenshtein(q, w);
    const maxLen = Math.max(q.length, w.length, 3);
    const score = Math.max(0, 1 - dist / maxLen);
    if (score > mejor) mejor = score;
  });
  // Coincidencia por palabra individual (no substring exacto): la limitamos a un máximo de 0.85
  // para que siempre puntúe algo por debajo de una coincidencia exacta o de substring real,
  // pero sin penalizar tanto que un típo de una sola letra (ej. "Roiz"/"Ruis" -> "Ruiz") quede fuera del umbral.
  return Math.min(mejor, 0.85);
}

// Formatea nombres/textos libres a Título al guardar (p.ej. "cristofer garcia" -> "Cristofer Garcia").
// Respeta partículas típicas en español (de, del, la, los, y) en minúscula salvo que sean la primera palabra.
const PARTICULAS_MINUSCULA = new Set(['de', 'del', 'la', 'las', 'los', 'y']);
function toTitleCase(str) {
  if (!str) return str;
  return str
    .trim()
    .split(/\s+/)
    .map((palabra, i) => {
      const lower = palabra.toLowerCase();
      if (i > 0 && PARTICULAS_MINUSCULA.has(lower)) return lower;
      return lower.replace(/(^|[-'])([a-záéíóúñü])/g, (m, sep, ch) => sep + ch.toUpperCase());
    })
    .join(' ');
}

function marcasCatalogo() {
  return Object.keys(CATALOGO_VEHICULOS).sort((a, b) => a.localeCompare(b, 'es'));

function modelosCatalogo(marca) {
  if (!marca) return [];
  const key = Object.keys(CATALOGO_VEHICULOS).find(k => k.toLowerCase() === marca.trim().toLowerCase());
  return key ? CATALOGO_VEHICULOS[key] : [];
}
// Registra (si hace falta) una marca/modelo nuevo escrito manualmente por el usuario, extendiendo el catálogo en caliente.
function registrarEnCatalogo(marca, modelo) {
  const marcaFmt = toTitleCase((marca || '').trim());
  if (!marcaFmt) return;
  const keyExistente = Object.keys(CATALOGO_VEHICULOS).find(k => k.toLowerCase() === marcaFmt.toLowerCase());
  const key = keyExistente || marcaFmt;
  if (!CATALOGO_VEHICULOS[key]) CATALOGO_VEHICULOS[key] = [];
  const modeloFmt = toTitleCase((modelo || '').trim());
  if (modeloFmt && !CATALOGO_VEHICULOS[key].some(m => m.toLowerCase() === modeloFmt.toLowerCase())) {
    CATALOGO_VEHICULOS[key].push(modeloFmt);
  }
}

function parseFranja(f) {
  const [ini, fin] = f.split(' - ');
  return { start: Number(ini.split(':')[0]), end: Number(fin.split(':')[0]) };
}
// Dos franjas entran en conflicto si no dejan al menos 1 hora de margen entre ellas
// (el conductor necesita ese margen para desplazarse a su próximo servicio).
function franjasConflict(f1, f2) {
  const a = parseFranja(f1), b = parseFranja(f2);
  return !((a.end + 1 <= b.start) || (b.end + 1 <= a.start));
}

function SignaturePad({ value, onChange }) {
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const hasDrawnRef = useRef(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
  }, []);

  function getPos(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  }
  function start(e) {
    e.preventDefault();
    drawingRef.current = true;
    const { x, y } = getPos(e);
    const ctx = canvasRef.current.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(x, y);
  }
  function move(e) {
    if (!drawingRef.current) return;
    e.preventDefault();
    const { x, y } = getPos(e);
    const ctx = canvasRef.current.getContext('2d');
    ctx.lineTo(x, y);
    ctx.stroke();
    hasDrawnRef.current = true;
  }
  function end() {
    if (!drawingRef.current) return;
    drawingRef.current = false;
    if (hasDrawnRef.current) {
      onChange(canvasRef.current.toDataURL('image/png'), true);
    }
  }
  function clear() {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    hasDrawnRef.current = false;
    onChange(null, false);
  }

  return (
    <div>
      <div className="border-2 border-dashed border-slate-300 rounded-xl overflow-hidden bg-white">
        <canvas
          ref={canvasRef}
          width={320}
          height={140}
          className="w-full touch-none cursor-crosshair"
          onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
          onTouchStart={start} onTouchMove={move} onTouchEnd={end}
        />
      </div>
      <div className="flex items-center justify-between mt-2">
        <span className="text-xs text-slate-400">Firma del cliente en la pantalla</span>
        <button type="button" onClick={clear} className="text-xs text-slate-500 underline hover:text-slate-700">Borrar firma</button>
      </div>
    </div>
  );
}

/* ======================================================================
   BUSCADOR INTELIGENTE DE VEHÍCULOS (matrícula primero, con fuzzy match)
   ====================================================================== */

function buscarVehiculosPorMatricula(query) {
  const norm = normalizePlate(query);
  if (norm.length < 2) return { matches: [], isFuzzy: false };
  const candidatos = Object.entries(VEHICLES).map(([id, v]) => ({ id, v }));
  let matches = candidatos.filter(c => normalizePlate(c.v.matricula).includes(norm));
  let isFuzzy = false;
  if (matches.length === 0) {
    const puntuados = candidatos
      .map(c => ({ ...c, score: fuzzyScore(norm, normalizePlate(c.v.matricula)) }))
      .filter(c => c.score > 0.45)
      .sort((a, b) => b.score - a.score);
    matches = puntuados.slice(0, 5);
    isFuzzy = matches.length > 0;
  }
  return { matches: matches.slice(0, 8), isFuzzy };
}

// Combobox genérico: el usuario puede escribir libremente O elegir de una lista de opciones filtrada en vivo.
// Se usa para Marca/Modelo (catálogo tabulado pero extensible con nuevas entradas).
function ComboBox({ value, onChange, opciones, placeholder, className, onBlurCommit }) {
  const [foco, setFoco] = useState(false);
  const filtradas = useMemo(() => {
    const q = (value || '').toLowerCase().trim();
    const base = !q ? opciones : opciones.filter(o => o.toLowerCase().includes(q));
    return base.slice(0, 8);
  }, [value, opciones]);
  const mostrar = foco && filtradas.length > 0;
  return (
    <div className="relative">
      <input
        value={value}
        onChange={e => onChange(e.target.value)}
        onFocus={() => setFoco(true)}
        onBlur={() => { setTimeout(() => setFoco(false), 150); if (onBlurCommit) onBlurCommit(); }}
        className={className}
        placeholder={placeholder}
        autoComplete="off"
      />
      {mostrar && (
        <div className="absolute z-30 mt-1 w-full bg-white border border-slate-200 rounded-lg shadow-lg max-h-48 overflow-y-auto">
          {filtradas.map(o => (
            <button

              onMouseDown={() => onChange(o)}

}

/* ======================================================================
   DIRECCIÓN CON VERIFICACIÓN REAL EN EL MAPA (OpenStreetMap / Nominatim)
   ====================================================================== */

function AddressAutocomplete({ value, verificada, onChange, placeholder, error }) {
  const [sugerencias, setSugerencias] = useState([]);
  const [buscando, setBuscando] = useState(false);
  const [foco, setFoco] = useState(false);
  const [huboError, setHuboError] = useState(false);
  const debounceRef = useRef(null);
  const reqIdRef = useRef(0);

  useEffect(() => {
    if (debounceRef.current) clearTimeout(debounceRef.current);
    if (!foco || value.trim().length < 5 || verificada) { setSugerencias([]); return; }
    debounceRef.current = setTimeout(async () => {
      const myReq = ++reqIdRef.current;
      setBuscando(true);
      setHuboError(false);
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=0&limit=5&countrycodes=es&q=${encodeURIComponent(value)}`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'es' } });
        const data = await res.json();
        if (myReq === reqIdRef.current) setSugerencias(data);
      } catch (e) {
        if (myReq === reqIdRef.current) { setHuboError(true); setSugerencias([]); }
      } finally {
        if (myReq === reqIdRef.current) setBuscando(false);
      }
    }, 450);
    return () => { if (debounceRef.current) clearTimeout(debounceRef.current); };
  }, [value, foco]);

  function seleccionar(s) {
    onChange({ direccion: s.display_name, verificada: true, coords: { lat: Number(s.lat), lng: Number(s.lon) } });
    setSugerencias([]);
  }
  function escribirManual(texto) {
    onChange({ direccion: texto, verificada: false, coords: null });
  }

  const mostrarDropdown = foco && value.trim().length >= 5 && !verificada;

  return (
    <div className="relative">
      <div className="relative">
        <input
          value={value}
          onChange={e => escribirManual(e.target.value)}
          onFocus={() => setFoco(true)}
          onBlur={() => setTimeout(() => setFoco(false), 200)}
          className={inputCls(error) + (verificada ? ' pr-8' : '')}
          placeholder={placeholder || 'Calle, número, piso, código postal, ciudad'}
          autoComplete="off"
        />
        {verificada && (
          <span className="absolute right-2 top-1/2 -translate-y-1/2 text-emerald-600" title="Dirección verificada en el mapa">✓</span>
        )}
      </div>
      <div className="flex items-center gap-1.5 mt-1 min-h-[14px]">
        {verificada ? (
          <span className="text-[11px] text-emerald-600 font-medium">✓ Verificada en el mapa (OpenStreetMap)</span>
        ) : value.trim().length > 0 ? (
          <span className="text-[11px] text-amber-600">⚠ Dirección no verificada — selecciona una sugerencia para confirmar que existe en el mapa</span>
        ) : null}
      </div>
      {mostrarDropdown && (
        <div className="absolute z-30 mt-1 w-full bg-white border border-slate-200 rounded-lg shadow-lg max-h-64 overflow-y-auto">
          {buscando && <div className="px-3 py-2.5 text-xs text-slate-400">Buscando en el mapa...</div>}
          {!buscando && huboError && <div className="px-3 py-2.5 text-xs text-red-500">No se pudo verificar (sin conexión a internet). Puedes continuar con la dirección escrita manualmente.</div>}
          {!buscando && !huboError && sugerencias.length === 0 && value.trim().length >= 5 && (
            <div className="px-3 py-2.5 text-xs text-slate-400">Sin coincidencias en el mapa todavía. Sigue escribiendo o continúa manualmente.</div>
          )}
          {sugerencias.map((s, i) => (
            <button
              type="button" key={s.place_id || i}
              onMouseDown={() => seleccionar(s)}
              className="w-full text-left px-3 py-2.5 hover:bg-slate-50 border-b border-slate-100 last:border-0 text-xs text-slate-700"
            >
              📍 {s.display_name}
            </button>
          ))}
          {sugerencias.length > 0 && (
            <div className="px-3 py-1 text-[10px] text-slate-300 border-t border-slate-100">© OpenStreetMap contributors</div>
          )}
        </div>
      )}
    </div>
  );
}

/* ======================================================================
   HELPERS DE DATOS (lookups y cálculos derivados)
   ====================================================================== */

function getClient(id) { return id ? CLIENTS.find(c => c.id === id) : null; }
function getVehicle(id) { return id ? VEHICLES[id] : null; }
function getDriver(id) { return id ? DRIVERS.find(d => d.id === id) : null; }
// Conductores que pueden ir solos a un servicio: solo los que ya completaron el proceso de alta (dados de alta).
// Los candidatos en proceso (documentación pendiente / en supervisión) no pueden asignarse solos a un traslado.
function driversAsignables() { return DRIVERS.filter(d => d.procesoEstado === 'activo'); }

// Devuelve la lista de personas (usuarios) asociadas a un vehículo, con su relación y si es el contacto principal
function getUsuariosVehiculo(vehiculoId) {
  const veh = getVehicle(vehiculoId);
  if (!veh || !veh.usuarios) return [];
  return veh.usuarios.map(u => ({ ...u, persona: getClient(u.clienteId) })).filter(u => u.persona);
}
function getUsuarioPrincipal(vehiculoId) {
  const usuarios = getUsuariosVehiculo(vehiculoId);
  return usuarios.find(u => u.esPrincipal) || usuarios[0] || null;
}

const DRIVING_STATES = [ESTADOS.CAMINO_RECOGIDA, ESTADOS.CAMINO_TALLER, ESTADOS.CAMINO_ENTREGA];
const ACTIVE_TODAY_STATES = [ESTADOS.AGENDADO, ESTADOS.CAMINO_RECOGIDA, ESTADOS.EN_DOMICILIO_RECOGIDA, ESTADOS.CAMINO_TALLER, ESTADOS.EN_TALLER, ESTADOS.CAMINO_ENTREGA, ESTADOS.EN_DOMICILIO_ENTREGA];

function driverTrasladosHoy(driverId, traslados) {
  return traslados.filter(t => t.conductorId === driverId && t.fecha && sameDay(t.fecha, TODAY) && t.estado !== ESTADOS.CANCELADO);
}
function driverEstadoActual(driverId, traslados) {
  const driver = getDriver(driverId);
  if (!driver) return { label: 'Sin asignar', color: '#94A3B8' };
  if (driver.descansoHoy) return { label: 'Descanso', color: '#64748B' };
  const hoy = driverTrasladosHoy(driverId, traslados);
  const enRuta = hoy.some(t => DRIVING_STATES.includes(t.estado));
  if (enRuta) return { label: 'En ruta', color: '#B45309' };
  return { label: 'Disponible', color: '#15803D' };
}

// Franjas horarias que ocupa un conductor en una fecha dada (recogida y/o entrega de cada traslado asignado)
function driverCompromisosEnFecha(driverId, fechaStr, traslados, excludeId) {
  const compromisos = [];
  traslados.forEach(t => {
    if (t.conductorId !== driverId || t.estado === ESTADOS.CANCELADO || t.id === excludeId) return;
    if (t.franjaRecogida && t.fechaRecogida && dateInputValue(t.fechaRecogida) === fechaStr) compromisos.push(t.franjaRecogida);
    if (t.franjaEntrega && t.fechaEntrega && dateInputValue(t.fechaEntrega) === fechaStr) compromisos.push(t.franjaEntrega);
  });
  return compromisos;
}
// ¿Puede el conductor tomar esta franja en esta fecha? (respeta 1h de margen entre servicios)
function driverDisponibleEnFranja(driverId, fechaStr, franja, traslados, excludeId) {
  const compromisos = driverCompromisosEnFecha(driverId, fechaStr, traslados, excludeId);
  return !compromisos.some(f => franjasConflict(f, franja));
}
// Compatibilidad con el formulario anterior (franja exacta ya ocupada)
function driverOcupaFranja(driverId, fechaStr, franja, traslados, excludeId) {
  return !driverDisponibleEnFranja(driverId, fechaStr, franja, traslados, excludeId);
}

// Vehículos asociados a una persona (relación inversa a getUsuariosVehiculo)
function getVehiculosDeCliente(clienteId) {
  return Object.entries(VEHICLES)
    .filter(([id, v]) => v.usuarios && v.usuarios.some(u => u.clienteId === clienteId))
    .map(([id, v]) => ({ id, v, relacion: v.usuarios.find(u => u.clienteId === clienteId).relacion }));
}

function estimarImporte(t) {
  return 24.90 + (t.seguro ? 4.90 : 0);
}

// Etapas del proceso de selección/alta de conductores (mini ATS/HR para gig workers):
// documentos_pendientes -> en_supervision (primeros 3 servicios acompañados) -> activo (dado de alta, opera solo).
const PROCESO_CONDUCTOR_META = {
  documentos_pendientes: { label: 'Documentación pendiente', color: '#B91C1C', bg: '#FEE2E2', orden: 0 },
  en_supervision:        { label: 'En supervisión',          color: '#B45309', bg: '#FEF3C7', orden: 1 },
  activo:                { label: 'Dado de alta',            color: '#15803D', bg: '#DCFCE7', orden: 2 },
};

// Segmentación de ciclo de vida del cliente, adaptada del modelo de segmentación del sector financiero
// (Registrado / Activado / Recompra / Fidelizado / Sin actividad / Churn-Perdido, con reglas tipo
// fn_GetFactoringLifecycleStage()) al contexto de un taller: en vez de "operaciones financieras" contamos
// traslados/servicios completados, y en vez de "días desde última operación" usamos días desde el último servicio.
const LIFECYCLE_META = {
  registrado:  { label:'Registrado',    color:'#0369A1', bg:'#E0F2FE',
    descripcion:'Cliente dado de alta en el sistema que todavía no ha completado ningún servicio.' },
  activado:    { label:'Activado',      color:'#6D28D9', bg:'#EDE9FE',
    descripcion:'Completó su primer servicio y aún no ha vuelto a repetir.' },
  recompra:    { label:'Recompra',      color:'#0E7490', bg:'#CFFAFE',
    descripcion:'Ha repetido al menos una vez (2+ servicios completados) y sigue activo recientemente.' },
  fidelizado:  { label:'Fidelizado',    color:'#B45309', bg:'#FEF3C7',
    descripcion:'Cliente recurrente de alto valor: 4 o más servicios completados con actividad reciente.' },
  sinactividad:{ label:'Sin actividad', color:'#7C2D12', bg:'#FFEDD5',
    descripcion:'Tuvo servicios previos pero no ha vuelto en un tiempo (entre 90 y 180 días); riesgo de fuga.' },
  churn:       { label:'Churn / Perdido', color:'#B91C1C', bg:'#FEE2E2',
    descripcion:'No completa un servicio desde hace más de 180 días; se considera perdido salvo reactivación.' },
};
// Equivalente a una fn_GetWorkshopLifecycleStage(clienteId): calcula la etapa según nº de servicios completados
// y recencia del último, igual que la función SQL de referencia del sector financiero.
function getLifecycleTag(clienteId, traslados) {
  const historial = traslados.filter(t => t.clienteId === clienteId && t.estado === ESTADOS.ENTREGADO);
  if (historial.length === 0) return LIFECYCLE_META.registrado;
  const ultima = historial.reduce((max, t) => t.fecha > max.fecha ? t : max, historial[0]);
  const diasDesdeUltima = (TODAY - ultima.fecha) / 86400000;
  if (diasDesdeUltima > 180) return LIFECYCLE_META.churn;
  if (diasDesdeUltima > 90) return LIFECYCLE_META.sinactividad;
  if (historial.length >= 4) return LIFECYCLE_META.fidelizado;
  if (historial.length >= 2) return LIFECYCLE_META.recompra;
  return LIFECYCLE_META.activado;
}

function TallerDashboard({ traslados, brand, onOpenTraslado, onNuevoTraslado, onNuevoLead, onAbrirLead, onAsignarConductor, onCambiarEstadoManual , openDrawer}) {
  const [estadoFiltro, setEstadoFiltro] = useState('todos');
  const [conductorFiltro, setConductorFiltro] = useState('todos');
  const [fechaFiltro, setFechaFiltro] = useState('todos'); // todos | hoy | manana | ayer
  const [busqueda, setBusqueda] = useState('');
  const [ordenDir, setOrdenDir] = useState('asc'); // el orden siempre es cronológico; esto solo invierte la dirección
  const [vista, setVista] = useState('lista');

  function matchesFechaFiltro(t) {
    if (fechaFiltro === 'todos') return true;
    if (!t.fecha) return false;
    const yest = new Date(TODAY); yest.setDate(yest.getDate()-1);
    const tom = new Date(TODAY); tom.setDate(tom.getDate()+1);
    if (fechaFiltro === 'hoy') return sameDay(t.fecha, TODAY);
    if (fechaFiltro === 'manana') return sameDay(t.fecha, tom);
    if (fechaFiltro === 'ayer') return sameDay(t.fecha, yest);
    return true;
  }
  function matchesBusqueda(t) {
    if (!busqueda.trim()) return true;
    const q = busqueda.trim().toLowerCase();
    const qPlate = normalizePlate(busqueda);
    const cliente = getClient(t.clienteId);
    const vehiculo = getVehicle(t.vehiculoId);
    const matricula = vehiculo ? vehiculo.matricula : (t.matriculaPreRegistro || '');
    const coincideExacta = (
      t.id.toLowerCase().includes(q) ||
      (cliente && cliente.nombre.toLowerCase().includes(q)) ||
      (qPlate.length >= 2 && normalizePlate(matricula).includes(qPlate)) ||
      (vehiculo && `${vehiculo.marca} ${vehiculo.modelo}`.toLowerCase().includes(q))
    );
    if (coincideExacta) return true;
    if (q.length < 3) return false;
    // Sin coincidencia exacta: probamos fuzzy (typos) contra nombre del cliente y matrícula
    const scoreNombre = cliente ? fuzzyScore(busqueda, cliente.nombre) : 0;
    const scoreMatricula = fuzzyScore(busqueda, matricula);
    return scoreNombre >= 0.7 || scoreMatricula >= 0.7;
  }

  // Base filtrada por conductor + fecha + búsqueda (para que los contadores reflejen el contexto activo)
  const baseFiltrada = useMemo(() => {
    return traslados.filter(t =>
      (conductorFiltro === 'todos' || t.conductorId === conductorFiltro) &&
      matchesFechaFiltro(t) &&
      matchesBusqueda(t)
    );
  }, [traslados, conductorFiltro, fechaFiltro, busqueda]);

  // Sugerencia "¿quisiste decir...?" cuando la búsqueda no encuentra nada
  const sugerencia = useMemo(() => {
    if (!busqueda.trim() || baseFiltrada.length > 0) return null;
    let mejor = null, mejorScore = 0;
    traslados.forEach(t => {
      const cliente = getClient(t.clienteId);
      const vehiculo = getVehicle(t.vehiculoId);
      const matricula = vehiculo ? vehiculo.matricula : (t.matriculaPreRegistro || '');
      [matricula, cliente ? cliente.nombre : ''].forEach(campo => {
        const score = fuzzyScore(busqueda, campo);
        if (score > mejorScore) { mejorScore = score; mejor = campo; }
      });
    });
    return mejorScore > 0.35 ? mejor : null;
  }, [busqueda, baseFiltrada, traslados]);

  const counts = useMemo(() => {
    const c = {}; BUCKET_ORDER.forEach(b => c[b] = 0);
    baseFiltrada.forEach(t => { c[bucketEstado(t.estado)]++; });
    return c;
  }, [baseFiltrada]);

  // El orden es SIEMPRE cronológico (nunca alfabético) — los filtros de arriba acotan (where),
  // no reordenan. Solo se puede invertir la dirección del tiempo con el botón de la columna Fecha.
  const filtrados = useMemo(() => {
    let list = baseFiltrada.filter(t => estadoFiltro === 'todos' || bucketEstado(t.estado) === estadoFiltro);
    const dir = ordenDir === 'asc' ? 1 : -1;
    list = [...list].sort((a, b) => {
      if (!a.fecha && !b.fecha) return 0;
      if (!a.fecha) return 1;
      if (!b.fecha) return -1;
      return (a.fecha - b.fecha) * dir;
    });
    return list;
  }, [baseFiltrada, estadoFiltro, ordenDir]);

  function abrirFila(t) {
    openDrawer('traslado', t.id);
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">Traslados</h1>
          <p className="text-sm text-slate-500">Vista general de recogidas, entregas y agendamientos por link</p>
        </div>
        <div className="flex items-center gap-2">
          <button
            onClick={onNuevoLead}
            className="px-4 py-2.5 rounded-xl text-sm font-semibold border-2 hover:bg-slate-50"
            style={{ borderColor: brand.color, color: brand.color }}
          >
            🔗 Enviar link de agendamiento
          </button>
          <button
            onClick={onNuevoTraslado}
            className="px-4 py-2.5 rounded-xl text-white text-sm font-semibold shadow-sm hover:opacity-90"
            style={{ backgroundColor: brand.color }}
          >
            + Agendar traslado
          </button>
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3 mb-5">
        {BUCKET_ORDER.map(b => (
          <StatChip
            key={b}
            label={BUCKET_META[b].label}
            count={counts[b]}
            color={BUCKET_META[b].color}
            active={estadoFiltro === b}
            onClick={() => setEstadoFiltro(estadoFiltro === b ? 'todos' : b)}
          />
        ))}
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4 mb-4 flex flex-wrap gap-3 items-center">
        <input
          value={busqueda}
          onChange={e => setBusqueda(e.target.value)}
          placeholder="Buscar por matrícula (ignora espacios), cliente o nº de traslado..."
          className="flex-1 min-w-[220px] px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400/40"
        />
        <select value={conductorFiltro} onChange={e => setConductorFiltro(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-300 text-sm">
          <option value="todos">Todos los conductores</option>
          {driversAsignables().map(d => <option key={d.id} value={d.id}>{d.nombre}</option>)}
        </select>
        <DateFilterGroup value={fechaFiltro} onChange={setFechaFiltro} />
        {(estadoFiltro !== 'todos' || conductorFiltro !== 'todos' || fechaFiltro !== 'todos' || busqueda) && (
          <button
            onClick={() => { setEstadoFiltro('todos'); setConductorFiltro('todos'); setFechaFiltro('todos'); setBusqueda(''); }}
            className="text-xs text-slate-500 underline hover:text-slate-700"
          >Limpiar filtros</button>
        )}
        <div className="ml-auto"><ViewToggle vista={vista} setVista={setVista} /></div>
      </div>

      {sugerencia && (
        <div className="mb-3 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
          Sin resultados exactos. ¿Quisiste decir <button onClick={() => setBusqueda(sugerencia)} className="underline font-semibold">"{sugerencia}"</button>?
        </div>
      )}

      {vista === 'kanban' ? (
        <TrasladosKanban traslados={filtrados} onOpenTraslado={onOpenTraslado} onAbrirLead={onAbrirLead} onDropEstado={onCambiarEstadoManual} />
      ) : (
        <>
          <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 border-b border-slate-200">
                <tr>
                  <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Nº</th>
                  <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Cliente / Vehículo</th>
                  <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">
                    <button onClick={() => setOrdenDir(d => d === 'asc' ? 'desc' : 'asc')} className="inline-flex items-center gap-1 hover:text-slate-800" title="El orden siempre es cronológico; esto solo invierte la dirección.">
                      Fecha y franja <span className="text-[10px]">{ordenDir === 'asc' ? '▲' : '▼'}</span>
                    </button>
                  </th>
                  <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Conductor</th>
                  <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Estado</th>
                  <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Seguro</th>
                  <th className="w-8"></th>
                </tr>
              </thead>
              <tbody>
                {filtrados.map(t => {
                  const bucket = bucketEstado(t.estado);
                  const esLead = bucket === 'lead' || bucket === 'link_enviado';
                  const cliente = getClient(t.clienteId);
                  const vehiculo = getVehicle(t.vehiculoId);
                  const alertas = getAlertasTraslado(t);
                  return (
                    <tr key={t.id} className={`border-b border-slate-100 last:border-0 hover:bg-slate-100/70 ${alertas.length ? 'bg-amber-50/70' : ''}`}>
                      <td className="px-4 py-3 font-mono text-xs text-slate-500 cursor-pointer" onClick={() => abrirFila(t)}>{t.id}</td>
                      <td className="px-4 py-3 cursor-pointer" onClick={() => abrirFila(t)}>
                        {esLead ? (
                          <div>
                            <div className="font-semibold text-slate-800 font-mono">{t.matriculaPreRegistro}</div>
                            <div className="text-xs text-slate-400">Pendiente de completar datos</div>
                          </div>
                        ) : (
                          <div>
                            <div className="font-semibold text-slate-800">{cliente ? cliente.nombre : '—'}</div>
                            <div className="text-xs text-slate-500">{vehiculo ? `${vehiculo.marca} ${vehiculo.modelo} · ${vehiculo.matricula}` : ''}</div>
                          </div>
                        )}
                      </td>
                      <td className="px-4 py-3 cursor-pointer" onClick={() => abrirFila(t)}>
                        {t.fecha ? (<><div className="text-slate-700">{formatDayLabel(t.fecha)}</div><div className="text-xs text-slate-500">{t.franja}</div></>) : <span className="text-xs text-slate-300">—</span>}
                      </td>
                      <td className="px-4 py-3">
                        {esLead ? <span className="text-xs text-slate-300">—</span> : (
                          <div className="flex items-center gap-1.5">
                            <select
                              value={t.conductorId || ''}
                              onClick={e => e.stopPropagation()}
                              onChange={e => onAsignarConductor(t.id, e.target.value || null)}
                              className="text-xs border border-slate-200 rounded-md px-1.5 py-1 bg-white max-w-[140px]"
                            >
                              <option value="">Sin asignar</option>
                              {driversAsignables().map(d => <option key={d.id} value={d.id}>{d.nombre}</option>)}
                            </select>
                            {alertas.length > 0 && <AlertaIcono mensaje={alertas.join(' · ')} />}
                          </div>
                        )}
                      </td>
                      <td className="px-4 py-3 cursor-pointer" onClick={() => abrirFila(t)}><EstadoPill estado={t.estado} /></td>
                      <td className="px-4 py-3 cursor-pointer" onClick={() => abrirFila(t)}>{esLead ? '—' : (t.seguro ? <span className="text-emerald-600 text-xs font-semibold">✓ Sí</span> : <span className="text-slate-400 text-xs">No</span>)}</td>
                      <td className="px-2 py-3 text-slate-300 cursor-pointer" onClick={() => abrirFila(t)} aria-hidden="true">→</td>
                    </tr>
                  );
                })}
                {filtrados.length === 0 && (
                  <tr><td colSpan={7} className="px-4 py-10 text-center text-slate-400 text-sm">No hay traslados que coincidan con los filtros seleccionados.</td></tr>
                )}
              </tbody>
            </table>
          </div>
          <p className="text-xs text-slate-400 mt-3">{filtrados.length} elemento{filtrados.length !== 1 ? 's' : ''} · haz clic en una fila para ver el detalle</p>
        </>
      )}
    </div>
  );
}

// Ícono de alerta pequeño con tooltip nativo (hover) explicando la razón — reemplaza el badge grande.
function AlertaIcono({ mensaje }) {
  if (!mensaje) return null;
  return (
    <span
      title={mensaje}
      className="inline-flex items-center justify-center w-4 h-4 rounded-full bg-amber-100 text-amber-700 text-[10px] font-bold cursor-help shrink-0"
    >!</span>
  );
}
function SinConductorBadge() {
  return <AlertaIcono mensaje="Sin conductor asignado. Asígnalo antes de la franja para evitar retrasos en el servicio." />;
}

// Calcula alertas reales de un traslado (sin conductor, franja vencida sin iniciar, etc.)
function getAlertasTraslado(t) {
  const alertas = [];
  const bucket = bucketEstado(t.estado);
  const operativo = bucket !== 'lead' && bucket !== 'link_enviado' && bucket !== 'cancelado' && bucket !== 'entregado';
  if (operativo && !t.conductorId) {
    alertas.push('Sin conductor asignado. Asígnalo antes de la franja para evitar retrasos en el servicio.');
  }
  if (t.estado === ESTADOS.AGENDADO && t.fecha && t.fecha.getTime() < Date.now()) {
    alertas.push('La franja agendada ya pasó y el conductor todavía no ha iniciado la recogida.');
  }
  return alertas;
}

function TallerNuevoTraslado({ traslados, brand, onBack, onCrear }) {
  const [matricula, setMatricula] = useState('');
  const [vehiculoSeleccionado, setVehiculoSeleccionado] = useState(null);
  const [usuarioContactoId, setUsuarioContactoId] = useState(null);
  const [nuevoContacto, setNuevoContacto] = useState(false);

  const [nuevoNombre, setNuevoNombre] = useState('');
  const [nuevoTelefono, setNuevoTelefono] = useState('');
  const [marca, setMarca] = useState('');
  const [modelo, setModelo] = useState('');
  const [km, setKm] = useState('');

  const [tipoServicio, setTipoServicio] = useState('ida_vuelta');
  const [mismaDireccion, setMismaDireccion] = useState(true);
  const [dirRecogida, setDirRecogida] = useState({ direccion: '', verificada: false, coords: null });
  const [dirEntrega, setDirEntrega] = useState({ direccion: '', verificada: false, coords: null });

  const [fechaRecogida, setFechaRecogida] = useState(dateInputValue(TODAY));
  const [franjaRecogida, setFranjaRecogida] = useState('');
  const [fechaEntrega, setFechaEntrega] = useState(dateInputValue(TODAY));
  const [franjaEntrega, setFranjaEntrega] = useState('');

  const [conductorId, setConductorId] = useState('');
  const [seguro, setSeguro] = useState(false);

  const [errors, setErrors] = useState({});
  const [enviado, setEnviado] = useState(false);

  const usuariosVehiculo = vehiculoSeleccionado ? getUsuariosVehiculo(vehiculoSeleccionado) : [];

  function handleSeleccionarVehiculo(vehId) {
    setVehiculoSeleccionado(vehId);
    const veh = VEHICLES[vehId];
    setMarca(veh.marca); setModelo(veh.modelo); setKm(String(veh.km));
    setMatricula(veh.matricula);
    const principal = getUsuarioPrincipal(vehId);
    setNuevoContacto(false);
    if (principal) {
      setUsuarioContactoId(principal.clienteId);
      setNuevoNombre(principal.persona.nombre);
      setNuevoTelefono(principal.persona.telefono);
      setDirRecogida({ direccion: principal.persona.direccion, verificada: true, coords: null });
      setDirEntrega({ direccion: principal.persona.direccion, verificada: true, coords: null });
    }
  }
  function handleMatriculaLibre(texto) {
    setMatricula(texto);
    if (vehiculoSeleccionado && normalizePlate(texto) !== normalizePlate(VEHICLES[vehiculoSeleccionado].matricula)) {
      setVehiculoSeleccionado(null);
      setUsuarioContactoId(null);
      setNuevoContacto(true);
      setNuevoNombre(''); setNuevoTelefono(''); setMarca(''); setModelo(''); setKm('');
      setDirRecogida({ direccion: '', verificada: false, coords: null });
      setDirEntrega({ direccion: '', verificada: false, coords: null });
    }
  }
  function elegirContacto(usuarioId) {
    setUsuarioContactoId(usuarioId);
    setNuevoContacto(false);
    const persona = getClient(usuarioId);
    setNuevoNombre(persona.nombre);
    setNuevoTelefono(persona.telefono);
    setDirRecogida({ direccion: persona.direccion, verificada: true, coords: null });
    setDirEntrega({ direccion: persona.direccion, verificada: true, coords: null });
  }

  function conductorDisponible(driverId) {
    const d = getDriver(driverId);
    if (!d) return false;
    if (d.descansoHoy && ((tipoServicio !== 'vuelta' && fechaRecogida === dateInputValue(TODAY)) || (tipoServicio !== 'ida' && fechaEntrega === dateInputValue(TODAY)))) return false;
    let ok = true;
    if (tipoServicio !== 'vuelta' && franjaRecogida) ok = ok && driverDisponibleEnFranja(driverId, fechaRecogida, franjaRecogida, traslados);
    if (tipoServicio !== 'ida' && franjaEntrega) ok = ok && driverDisponibleEnFranja(driverId, fechaEntrega, franjaEntrega, traslados);
    return ok;
  }
  function cargaConductor(id) {
    return driverTrasladosHoy(id, traslados).length;
  }

  useEffect(() => {
    if (franjaRecogida && conductorId && !driverDisponibleEnFranja(conductorId, fechaRecogida, franjaRecogida, traslados)) setFranjaRecogida('');
  }, [conductorId, fechaRecogida]);
  useEffect(() => {
    if (franjaEntrega && conductorId && !driverDisponibleEnFranja(conductorId, fechaEntrega, franjaEntrega, traslados)) setFranjaEntrega('');
  }, [conductorId, fechaEntrega]);

  function validar() {
    const err = {};
    if (!matricula.trim()) err.matricula = 'Introduce la matrícula del vehículo.';
    if (!vehiculoSeleccionado) {
      if (!marca.trim()) err.marca = 'La marca es obligatoria.';
      if (!modelo.trim()) err.modelo = 'El modelo es obligatorio.';
    }
    if (!nuevoNombre.trim()) err.contacto = 'Indica el nombre del contacto para este traslado.';
    if (!/^[679]\d{8}$/.test((nuevoTelefono || '').replace(/\s/g, ''))) err.telefono = 'Introduce un teléfono español válido (9 dígitos).';
    if (tipoServicio !== 'vuelta' && (!dirRecogida.direccion.trim() || dirRecogida.direccion.trim().length < 8)) err.dirRecogida = 'Introduce la dirección de recogida.';
    if (tipoServicio !== 'ida' && !mismaDireccion && (!dirEntrega.direccion.trim() || dirEntrega.direccion.trim().length < 8)) err.dirEntrega = 'Introduce la dirección de entrega.';
    if (tipoServicio !== 'vuelta') {
      if (!fechaRecogida) err.fechaRecogida = 'Selecciona una fecha de recogida.';
      if (!franjaRecogida) err.franjaRecogida = 'Selecciona una franja de recogida.';
    }
    if (tipoServicio !== 'ida') {
      if (!fechaEntrega) err.fechaEntrega = 'Selecciona una fecha de entrega.';
      if (!franjaEntrega) err.franjaEntrega = 'Selecciona una franja de entrega.';
    }
    if (conductorId && !conductorDisponible(conductorId)) err.conductor = 'Ese conductor ya tiene un servicio que se solapa (recuerda: se exige 1h de margen entre servicios).';
    setErrors(err);
    return Object.keys(err).length === 0;
  }

  const formularioCompleto = useMemo(() => {
    if (!matricula.trim()) return false;
    if (!vehiculoSeleccionado) {
      if (!marca.trim() || !modelo.trim()) return false;
    }
    if (!nuevoNombre.trim()) return false;
    if (!/^[679]\d{8}$/.test((nuevoTelefono || '').replace(/\s/g, ''))) return false;
    if (tipoServicio !== 'vuelta' && (!dirRecogida.direccion.trim() || dirRecogida.direccion.trim().length < 8)) return false;
    if (tipoServicio !== 'ida' && !mismaDireccion && (!dirEntrega.direccion.trim() || dirEntrega.direccion.trim().length < 8)) return false;
    if (tipoServicio !== 'vuelta' && (!fechaRecogida || !franjaRecogida)) return false;
    if (tipoServicio !== 'ida' && (!fechaEntrega || !franjaEntrega)) return false;
    if (conductorId && !conductorDisponible(conductorId)) return false;
    return true;
  }, [matricula, vehiculoSeleccionado, marca, modelo, nuevoNombre, nuevoTelefono, tipoServicio, dirRecogida, mismaDireccion, dirEntrega, fechaRecogida, franjaRecogida, fechaEntrega, franjaEntrega, conductorId]);

  function handleSubmit(e) {
    e.preventDefault();
    if (!validar()) { setEnviado(true); return; }

    let finalClienteId = usuarioContactoId;
    let finalVehiculoId = vehiculoSeleccionado;
    const now = new Date();

    const nombreFmt = toTitleCase(nuevoNombre.trim());

    if (finalVehiculoId) {
      if (!finalClienteId) {
        finalClienteId = uid('c').toLowerCase();
        CLIENTS.push({ id: finalClienteId, nombre: nombreFmt, telefono: nuevoTelefono.trim(), direccion: dirRecogida.direccion || dirEntrega.direccion, clienteDesde: now });
        VEHICLES[finalVehiculoId].usuarios.push({ clienteId: finalClienteId, relacion: 'Otro contacto', esPrincipal: false });
      } else {
        const persona = getClient(finalClienteId);
        persona.nombre = nombreFmt;
        persona.telefono = nuevoTelefono.trim();
      }
    } else {
      finalClienteId = uid('c').toLowerCase();
      CLIENTS.push({ id: finalClienteId, nombre: nombreFmt, telefono: nuevoTelefono.trim(), direccion: dirRecogida.direccion || dirEntrega.direccion, clienteDesde: now });
      finalVehiculoId = uid('v').toLowerCase();
      registrarEnCatalogo(marca, modelo);
      VEHICLES[finalVehiculoId] = { marca: toTitleCase(marca.trim()), modelo: toTitleCase(modelo.trim()), anio: new Date().getFullYear(), matricula: matricula.trim().toUpperCase(), km: Number(km) || 0, color: 'No especificado', usuarios: [{ clienteId: finalClienteId, relacion: 'Titular', esPrincipal: true }] };
    }

    const franjaRec = tipoServicio !== 'vuelta' ? franjaRecogida : null;
    const franjaEnt = tipoServicio !== 'ida' ? franjaEntrega : null;
    const fechaRecDate = tipoServicio !== 'vuelta' ? dateConFranja(fechaRecogida, franjaRec) : null;
    const fechaEntDate = tipoServicio !== 'ida' ? dateConFranja(fechaEntrega, franjaEnt) : null;
    const dirEnt = mismaDireccion ? dirRecogida : dirEntrega;

    const nuevoId = 'TR-' + (1050 + Math.floor(Math.random() * 900));
    const timelineBase = [ev('Traslado agendado por el taller', now)];
    if (conductorId) timelineBase.push(ev(`Conductor asignado: ${getDriver(conductorId).nombre}`, now));

    const nuevo = {
      id: nuevoId, clienteId: finalClienteId, vehiculoId: finalVehiculoId, usuarioContactoId: finalClienteId,
      conductorId: conductorId || null,
      estado: ESTADOS.AGENDADO, tipoServicio, seguro,
      direccionRecogida: tipoServicio !== 'vuelta' ? dirRecogida.direccion.trim() : null,
      direccionRecogidaVerificada: !!dirRecogida.verificada,
      direccionEntrega: tipoServicio !== 'ida' ? dirEnt.direccion.trim() : null,
      direccionEntregaVerificada: !!dirEnt.verificada,
      fechaRecogida: fechaRecDate, franjaRecogida: franjaRec,
      fechaEntrega: fechaEntDate, franjaEntrega: franjaEnt,
      fecha: fechaRecDate || fechaEntDate, franja: franjaRec || franjaEnt,
      matriculaPreRegistro: matricula.trim().toUpperCase(),
      linkToken: null, linkEnviadoEn: null,
      timeline: timelineBase,
      checkin: null, checkout: null,
    };
    onCrear(nuevo);
  }

  return (
    <div className="max-w-3xl">
      <button onClick={onBack} className="text-sm text-slate-500 hover:text-slate-800 mb-4 inline-flex items-center gap-1">← Volver al listado</button>
      <h1 className="text-2xl font-bold text-slate-800 mb-1">Agendar nuevo traslado</h1>
      <p className="text-sm text-slate-500 mb-6">Busca por matrícula — si el vehículo ya existe, autocompletamos sus datos y las personas asociadas.</p>

      <form onSubmit={handleSubmit} className="bg-white rounded-xl border border-slate-200 p-6 space-y-6">
        {enviado && Object.keys(errors).length > 0 && (
          <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
            Corrige los campos marcados en rojo antes de continuar.
          </div>
        )}

        <div>
          <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wide mb-3">Vehículo</h3>
          <Field label="Matrícula" error={enviado && errors.matricula} hint="Escribe la matrícula — busca en vivo, ignora espacios y sugiere coincidencias aunque haya errores de tipeo.">
            <MatriculaAutocomplete value={matricula} onChangeText={handleMatriculaLibre} onSelectVehiculo={handleSeleccionarVehiculo} error={enviado && errors.matricula} />
          </Field>

          {vehiculoSeleccionado ? (
            <div className="bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2.5 text-xs text-emerald-700 mb-3">
              ✓ Vehículo existente — {marca} {modelo} · {usuariosVehiculo.length} persona{usuariosVehiculo.length !== 1 ? 's' : ''} asociada{usuariosVehiculo.length !== 1 ? 's' : ''}.
            </div>
          ) : matricula.trim() && (
            <div className="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-xs text-slate-500 mb-3">
              Matrícula nueva — completa marca, modelo y datos de contacto manualmente.
            </div>
          )}

          {!vehiculoSeleccionado && (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
              <Field label="Marca" error={enviado && errors.marca}>
                <ComboBox
                  value={marca}
                  onChange={v => { setMarca(v); if (modelo && !modelosCatalogo(v).some(m => m.toLowerCase() === modelo.toLowerCase())) setModelo(''); }}
                  opciones={marcasCatalogo()}
                  className={inputCls(enviado && errors.marca)}
                  placeholder="Escribe o elige, ej. Seat"
                />
              </Field>
              <Field label="Modelo" error={enviado && errors.modelo}>
                <ComboBox
                  value={modelo}
                  onChange={setModelo}
                  opciones={modelosCatalogo(marca)}
                  className={inputCls(enviado && errors.modelo)}
                  placeholder="Escribe o elige, ej. Ibiza"
                />
              </Field>
              <Field label="Kilometraje actual">
                <input value={km} onChange={e => setKm(e.target.value)} type="number" min="0" className={inputCls(false)} placeholder="Ej. 54000" />
              </Field>
            </div>
          )}
        </div>

        <div>
          <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wide mb-3">Contacto para este traslado</h3>
          {usuariosVehiculo.length > 0 && (
            <div className="flex flex-wrap gap-2 mb-3">
              {usuariosVehiculo.map(u => (
                <button key={u.clienteId} type="button" onClick={() => elegirContacto(u.clienteId)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${usuarioContactoId === u.clienteId && !nuevoContacto ? 'text-white border-transparent' : 'bg-white text-slate-600 border-slate-300'}`}
                  style={usuarioContactoId === u.clienteId && !nuevoContacto ? { backgroundColor: brand.color } : {}}>
                  {u.persona.nombre.split(' ')[0]} <span className="opacity-70">· {u.relacion}</span>
                </button>
              ))}
              <button type="button" onClick={() => { setNuevoContacto(true); setUsuarioContactoId(null); setNuevoNombre(''); setNuevoTelefono(''); }}
                className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${nuevoContacto ? 'text-white border-transparent' : 'bg-white text-slate-600 border-slate-300'}`}
                style={nuevoContacto ? { backgroundColor: brand.color } : {}}>+ Otra persona</button>
            </div>
          )}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
            <Field label="Nombre completo" error={enviado && errors.contacto}>
              <input value={nuevoNombre} onChange={e => setNuevoNombre(e.target.value)} className={inputCls(enviado && errors.contacto)} placeholder="Ej. Carmen López Díaz" />
            </Field>
            <Field label="Teléfono" error={enviado && errors.telefono}>
              <input value={nuevoTelefono} onChange={e => setNuevoTelefono(e.target.value)} className={inputCls(enviado && errors.telefono)} placeholder="Ej. 655 123 456" />
            </Field>
          </div>
        </div>

        <div>
          <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wide mb-3">¿Qué necesita el cliente?</h3>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4">
            {Object.entries(TIPO_SERVICIO_META).map(([key, meta]) => (
              <button key={key} type="button" onClick={() => setTipoServicio(key)}
                className={`px-3 py-3 rounded-lg text-xs font-semibold border-2 text-left ${tipoServicio === key ? 'border-transparent text-white' : 'border-slate-200 text-slate-600'}`}
                style={tipoServicio === key ? { backgroundColor: brand.color } : {}}>
                <div className="text-base mb-0.5">{meta.icon}</div>{meta.label}
              </button>
            ))}
          </div>

          {tipoServicio === 'ida_vuelta' && (
            <label className="flex items-center gap-2 mb-3 text-xs text-slate-600 cursor-pointer">
              <input type="checkbox" checked={mismaDireccion} onChange={e => setMismaDireccion(e.target.checked)} />
              Usar la misma dirección para recogida y entrega
            </label>
          )}

          <div className={`grid grid-cols-1 ${tipoServicio === 'ida_vuelta' ? 'sm:grid-cols-2' : ''} gap-4`}>
            {tipoServicio !== 'vuelta' && (
              <div className="bg-slate-50 rounded-lg p-4">
                <p className="text-xs font-bold text-slate-500 uppercase mb-2">✈️ Recogida (ida)</p>
                <Field label="Dirección" error={enviado && errors.dirRecogida}>
                  <AddressAutocomplete value={dirRecogida.direccion} verificada={dirRecogida.verificada}
                    onChange={({ direccion, verificada, coords }) => setDirRecogida({ direccion, verificada, coords })} error={enviado && errors.dirRecogida} />
                </Field>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="Fecha" error={enviado && errors.fechaRecogida}>
                    <input type="date" min={dateInputValue(TODAY)} value={fechaRecogida} onChange={e => setFechaRecogida(e.target.value)} className={inputCls(enviado && errors.fechaRecogida)} />
                  </Field>
                </div>
                <Field label="Franja" error={enviado && errors.franjaRecogida}>
                  <div className="grid grid-cols-2 gap-1.5">
                    {FRANJAS.map(f => {
                      const ocupada = conductorId ? !driverDisponibleEnFranja(conductorId, fechaRecogida, f, traslados) : false;
                      return (
                        <button key={f} type="button" disabled={ocupada} onClick={() => setFranjaRecogida(f)}
                          className={`px-2 py-1.5 rounded-lg text-[11px] font-medium border ${ocupada ? 'bg-slate-100 text-slate-300 line-through cursor-not-allowed' : franjaRecogida === f ? 'text-white border-transparent' : 'bg-white text-slate-600 border-slate-300'}`}
                          style={franjaRecogida === f && !ocupada ? { backgroundColor: brand.color } : {}}>{f}</button>
                      );
                    })}
                  </div>
                </Field>
              </div>
            )}
            {tipoServicio !== 'ida' && (
              <div className="bg-slate-50 rounded-lg p-4">
                <p className="text-xs font-bold text-slate-500 uppercase mb-2">🏁 Entrega (vuelta)</p>
                {!(tipoServicio === 'ida_vuelta' && mismaDireccion) && (
                  <Field label="Dirección" error={enviado && errors.dirEntrega}>
                    <AddressAutocomplete value={dirEntrega.direccion} verificada={dirEntrega.verificada}
                      onChange={({ direccion, verificada, coords }) => setDirEntrega({ direccion, verificada, coords })} error={enviado && errors.dirEntrega} />
                  </Field>
                )}
                <div className="grid grid-cols-2 gap-2">
                  <Field label="Fecha" error={enviado && errors.fechaEntrega}>
                    <input type="date" min={tipoServicio === 'ida_vuelta' ? fechaRecogida : dateInputValue(TODAY)} value={fechaEntrega} onChange={e => setFechaEntrega(e.target.value)} className={inputCls(enviado && errors.fechaEntrega)} />
                  </Field>
                </div>
                <Field label="Franja" error={enviado && errors.franjaEntrega}>
                  <div className="grid grid-cols-2 gap-1.5">
                    {FRANJAS.map(f => {
                      const ocupada = conductorId ? !driverDisponibleEnFranja(conductorId, fechaEntrega, f, traslados) : false;
                      return (
                        <button key={f} type="button" disabled={ocupada} onClick={() => setFranjaEntrega(f)}
                          className={`px-2 py-1.5 rounded-lg text-[11px] font-medium border ${ocupada ? 'bg-slate-100 text-slate-300 line-through cursor-not-allowed' : franjaEntrega === f ? 'text-white border-transparent' : 'bg-white text-slate-600 border-slate-300'}`}
                          style={franjaEntrega === f && !ocupada ? { backgroundColor: brand.color } : {}}>{f}</button>
                      );
                    })}
                  </div>
                </Field>
              </div>
            )}
          </div>
        </div>

        <div>
          <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wide mb-3">Conductor</h3>
          <Field label="Conductor asignado" error={enviado && errors.conductor} hint="Puedes dejarlo sin asignar y asignarlo después desde el dashboard. Se respeta 1h de margen entre servicios de un mismo conductor.">
            <select value={conductorId} onChange={e => setConductorId(e.target.value)} className={inputCls(enviado && errors.conductor)}>
              <option value="">— Sin asignar (asignar después) —</option>
              {driversAsignables().map(d => {
                const disp = conductorDisponible(d.id);
                return (
                  <option key={d.id} value={d.id} disabled={!disp && (franjaRecogida || franjaEntrega)}>
                    {d.nombre} ({cargaConductor(d.id)} hoy{d.descansoHoy ? ' · descanso hoy' : ''}{!disp && (franjaRecogida || franjaEntrega) ? ' · NO DISPONIBLE' : ''})
                  </option>
                );
              })}
            </select>
          </Field>
          {!conductorId && <div className="mb-2"><SinConductorBadge /></div>}
        </div>

        <div>
          <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wide mb-3">Seguro opcional del traslado</h3>
          <div className="flex items-center justify-between bg-slate-50 rounded-lg p-4">
            <div>
              <p className="text-sm font-medium text-slate-700">Cobertura Mapfre para este traslado</p>
              <p className="text-xs text-slate-500">Cubre daños al vehículo durante la recogida y entrega. +4,90 € por traslado.</p>
            </div>
            <Toggle checked={seguro} onChange={setSeguro} color={brand.color} />
          </div>
        </div>

        <div className="flex justify-end gap-3 pt-2">
          <button type="button" onClick={onBack} className="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100">Cancelar</button>
          <button
            type="submit"
            className={`px-5 py-2.5 rounded-xl text-white text-sm font-semibold shadow-sm transition-colors ${formularioCompleto ? 'hover:opacity-90' : 'hover:opacity-80'}`}
            style={{ backgroundColor: formularioCompleto ? brand.color : '#94a3b8' }}
            title={formularioCompleto ? 'Agendar este traslado' : 'Faltan campos obligatorios por completar'}
          >Agendar traslado</button>
        </div>
      </form>
    </div>
  );
}

/* ======================================================================
   PANEL DEL TALLER — CONDUCTORES
   ====================================================================== */

// Formulario de alta de conductor (mini ATS/HR de gig workers): foto de ID, carnet de conducir y datos bancarios.
// El conductor entra al proceso de selección y no puede operar servicios en solitario hasta completar
// la supervisión de sus primeros 3 servicios y ser "dado de alta" explícitamente por el taller.
function NuevoConductorModal({ brand, onClose, onCrear }) {
  const [nombre, setNombre] = useState('');
  const [telefono, setTelefono] = useState('');
  const [fotoId, setFotoId] = useState(null);
  const [fotoLicencia, setFotoLicencia] = useState(null);
  const [iban, setIban] = useState('');
  const [enviado, setEnviado] = useState(false);

  function validar() {
    const err = {};
    if (!nombre.trim()) err.nombre = 'El nombre es obligatorio.';
    if (!/^[679]\d{8}$/.test((telefono || '').replace(/\s/g, ''))) err.telefono = 'Introduce un teléfono español válido (9 dígitos).';
    return err;
  }
  const errors = enviado ? validar() : {};

  function handleSubmit(e) {
    e.preventDefault();
    const err = validar();
    if (Object.keys(err).length > 0) { setEnviado(true); return; }
    onCrear({ nombre, telefono, fotoId, fotoLicencia, iban });
  }

  const docsCompletos = !!(fotoId && fotoLicencia && iban.trim());

  return (
    <Modal title="Registrar nuevo conductor" onClose={onClose} wide>
      <form onSubmit={handleSubmit} className="space-y-4">
        <p className="text-xs text-slate-500">
          El conductor entrará al proceso de selección: primero debe completar su documentación, luego acompañar
          (ser supervisado en) sus primeros {3} servicios, y solo entonces el taller puede darlo de alta para que opere en solitario.
        </p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
          <Field label="Nombre completo" error={errors.nombre}>
            <input value={nombre} onChange={e => setNombre(e.target.value)} className={inputCls(errors.nombre)} placeholder="Ej. Marta Iglesias Roldán" />
          </Field>
          <Field label="Teléfono" error={errors.telefono}>
            <input value={telefono} onChange={e => setTelefono(e.target.value)} className={inputCls(errors.telefono)} placeholder="Ej. 611 222 333" />
          </Field>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <SinglePhotoUploader foto={fotoId} onChange={setFotoId} label="Foto del DNI / NIE" />
          <SinglePhotoUploader foto={fotoLicencia} onChange={setFotoLicencia} label="Foto del carnet de conducir" />
        </div>
        <Field label="Cuenta bancaria (IBAN)" hint="Para el pago de los servicios realizados una vez dado de alta.">
          <input value={iban} onChange={e => setIban(e.target.value)} className={inputCls(false)} placeholder="Ej. ES91 2100 0418 4502 0005 1332" />
        </Field>
        <div className="text-xs px-3 py-2 rounded-lg" style={{ backgroundColor: docsCompletos ? '#DCFCE7' : '#FEF3C7', color: docsCompletos ? '#15803D' : '#B45309' }}>
          {docsCompletos ? '✓ Documentación completa — pasará directamente a "En supervisión".' : 'Puedes completar la documentación más tarde desde su ficha. Mientras tanto quedará en "Documentación pendiente".'}
        </div>
        <div className="flex justify-end gap-2 pt-2">
          <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-100">Cancelar</button>
          <button type="submit" className="px-4 py-2 rounded-lg text-white text-sm font-semibold" style={{ backgroundColor: brand.color }}>Registrar conductor</button>
        </div>
      </form>
    </Modal>
  );
}

function TallerConductores({ traslados, brand, onAbrirConductor, onCrearConductor, driversVersion }) {
  const [vista, setVista] = useState('lista');
  const [busqueda, setBusqueda] = useState('');
  const [procesoFiltro, setProcesoFiltro] = useState('todos');
  const [showNuevo, setShowNuevo] = useState(false);

  const grupos = {
    'Disponible': DRIVERS.filter(d => driverEstadoActual(d.id, traslados).label === 'Disponible'),
    'En ruta': DRIVERS.filter(d => driverEstadoActual(d.id, traslados).label === 'En ruta'),
    'Descanso': DRIVERS.filter(d => driverEstadoActual(d.id, traslados).label === 'Descanso'),
  };

  const filas = useMemo(() => {
    const q = busqueda.trim().toLowerCase();
    return DRIVERS
      .filter(d => !q || d.nombre.toLowerCase().includes(q) || d.telefono.includes(q))
      .filter(d => procesoFiltro === 'todos' || d.procesoEstado === procesoFiltro);
  }, [busqueda, procesoFiltro, driversVersion]);

  return (
    <div>
      <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
        <h1 className="text-2xl font-bold text-slate-800">Conductores</h1>
        <div className="flex items-center gap-2">
          <button onClick={() => setShowNuevo(true)} className="px-3 py-1.5 rounded-lg text-white text-xs font-semibold shadow-sm hover:opacity-90" style={{ backgroundColor: brand.color }}>+ Nuevo conductor</button>
          <ViewToggle vista={vista} setVista={setVista} />
        </div>
      </div>
      <p className="text-sm text-slate-500 mb-4">Estado y carga de trabajo en tiempo real, más el proceso de selección/alta de nuevos conductores.</p>

      {vista === 'lista' && (
        <div className="bg-white rounded-xl border border-slate-200 p-3 mb-4 flex flex-wrap gap-3 items-center">
          <input
            value={busqueda} onChange={e => setBusqueda(e.target.value)}
            placeholder="Buscar por nombre o teléfono..."
            className="flex-1 min-w-[200px] px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400/40"
          />
          <select value={procesoFiltro} onChange={e => setProcesoFiltro(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-300 text-sm">
            <option value="todos">Todos los procesos</option>
            {Object.entries(PROCESO_CONDUCTOR_META).map(([k, m]) => <option key={k} value={k}>{m.label}</option>)}
          </select>
        </div>
      )}

      {vista === 'lista' ? (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 border-b border-slate-200">
              <tr>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Conductor</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Estado</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Carga de hoy</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Calificación</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Incidentes</th>
                <th className="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Proceso de alta</th>
                <th className="w-8"></th>
              </tr>
            </thead>
            <tbody>
              {filas.map(d => {
                const estado = driverEstadoActual(d.id, traslados);
                const hoy = driverTrasladosHoy(d.id, traslados);
                const proc = PROCESO_CONDUCTOR_META[d.procesoEstado] || PROCESO_CONDUCTOR_META.activo;
                return (
                  <tr key={d.id} onClick={() => onAbrirConductor(d.id)} className="border-b border-slate-100 last:border-0 hover:bg-slate-50 cursor-pointer">
                    <td className="px-4 py-3">
                      <div className="flex items-center gap-2.5">
                        <div className="w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-xs shrink-0" style={{ backgroundColor: brand.color }}>{d.iniciales}</div>
                        <div>
                          <div className="font-semibold text-slate-800">{d.nombre}</div>
                          <div className="text-xs text-slate-500">{d.telefono}</div>
                        </div>
                      </div>
                    </td>
                    <td className="px-4 py-3">
                      <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-xs font-semibold" style={{ color: estado.color, backgroundColor: estado.color + '18' }}>
                        <span className={`w-1.5 h-1.5 rounded-full ${estado.label === 'En ruta' ? 'pulse-dot' : ''}`} style={{ backgroundColor: estado.color }}></span>
                        {estado.label}
                      </span>
                    </td>
                    <td className="px-4 py-3 text-slate-700">{hoy.length} traslado{hoy.length !== 1 ? 's' : ''}</td>
                    <td className="px-4 py-3 text-slate-700">{d.calificacion > 0 ? `⭐ ${d.calificacion.toFixed(1)}` : <span className="text-slate-300 text-xs">Sin valoraciones</span>}</td>
                    <td className="px-4 py-3 text-slate-700">{d.incidentes.length}</td>

                      <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold" style={{ color: proc.color, backgroundColor: proc.bg }}>{proc.label}</span>
                      {d.procesoEstado !== 'activo' && <div className="text-[11px] text-slate-400 mt-1">{d.serviciosSupervisados}/{d.serviciosRequeridos} servicios supervisados</div>}

                    <td className="px-2 py-3 text-slate-300" aria-hidden="true">→</td>

              {filas.length === 0 && (
                <tr><td colSpan={7} className="px-4 py-10 text-center text-slate-400 text-sm">No hay conductores que coincidan con los filtros seleccionados.</td></tr>

            </tbody>
          </table>
        </div>
      ) : (
        <div className="flex gap-3 overflow-x-auto pb-3">
          {Object.entries(grupos).map(([label, lista]) => (
            <div key={label} className="w-72 shrink-0 rounded-xl p-2 bg-slate-100">
              <div className="flex items-center justify-between px-1 mb-2">
                <span className="text-xs font-bold uppercase tracking-wide text-slate-500">{label}</span>
                <span className="text-xs text-slate-400">{lista.length}</span>
              </div>
              {lista.map(d => (
                <div key={d.id} onClick={() => onAbrirConductor(d.id)} className="bg-white rounded-lg border border-slate-200 p-3 mb-2 shadow-sm hover:shadow-md cursor-pointer">
                  <p className="text-sm font-semibold text-slate-800">{d.nombre}</p>
                  <p className="text-xs text-slate-500">⭐ {d.calificacion.toFixed(1)} · {driverTrasladosHoy(d.id, traslados).length} hoy</p>
                </div>

              {lista.length === 0 && <p className="text-[11px] text-slate-300 text-center py-4">Sin conductores</p>}

          {DRIVERS.some(d => d.procesoEstado !== 'activo') && (
            <div className="w-72 shrink-0 rounded-xl p-2 bg-amber-50">
              <div className="flex items-center justify-between px-1 mb-2">
                <span className="text-xs font-bold uppercase tracking-wide text-amber-700">En proceso de selección</span>
                <span className="text-xs text-amber-500">{DRIVERS.filter(d => d.procesoEstado !== 'activo').length}</span>
              </div>
              {DRIVERS.filter(d => d.procesoEstado !== 'activo').map(d => (
                <div key={d.id} onClick={() => onAbrirConductor(d.id)} className="bg-white rounded-lg border border-amber-200 p-3 mb-2 shadow-sm hover:shadow-md cursor-pointer">
                  <p className="text-sm font-semibold text-slate-800">{d.nombre}</p>
                  <p className="text-xs text-amber-600">{PROCESO_CONDUCTOR_META[d.procesoEstado].label} · {d.serviciosSupervisados}/{d.serviciosRequeridos}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {showNuevo && (
        <NuevoConductorModal
          brand={brand}
          onClose={() => setShowNuevo(false)}
          onCrear={(datos) => { onCrearConductor(datos); setShowNuevo(false); }}
        />
      )}
    </div>
  );
}

function TallerConductorDetalle({ driverId, traslados, brand, onBack, onAvanzarSupervision, onDarDeAlta, onCompletarDocumentos }) {
  const d = getDriver(driverId);
  if (!d) return null;
  const estado = driverEstadoActual(driverId, traslados);
  const viajes = traslados.filter(t => t.conductorId === driverId && t.estado !== ESTADOS.CANCELADO && bucketEstado(t.estado) !== 'lead' && bucketEstado(t.estado) !== 'link_enviado');
  const completados = viajes.filter(t => t.estado === ESTADOS.ENTREGADO);
  const enCurso = viajes.filter(t => t.estado !== ESTADOS.ENTREGADO && t.estado !== ESTADOS.AGENDADO);
  const proximos = viajes.filter(t => t.estado === ESTADOS.AGENDADO);
  const proc = PROCESO_CONDUCTOR_META[d.procesoEstado] || PROCESO_CONDUCTOR_META.activo;
  const enProceso = d.procesoEstado !== 'activo';

  return (
    <div>
      <button onClick={onBack} className="text-sm text-slate-500 hover:text-slate-800 mb-4 inline-flex items-center gap-1">← Volver a conductores</button>

      <div className="flex flex-wrap items-center gap-4 mb-6">
        <div className="w-16 h-16 rounded-full flex items-center justify-center text-white font-bold text-xl" style={{ backgroundColor: brand.color }}>{d.iniciales}</div>
        <div>
          <h1 className="text-2xl font-bold text-slate-800">{d.nombre}</h1>
          <p className="text-sm text-slate-500">{d.telefono} · {d.vehiculo}</p>
        </div>
        <div className="ml-auto flex items-center gap-2">
          {enProceso && <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold" style={{ color: proc.color, backgroundColor: proc.bg }}>{proc.label}</span>}
          <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold" style={{ color: estado.color, backgroundColor: estado.color + '18' }}>{estado.label}</span>
        </div>
      </div>

      {enProceso && (
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-5 mb-6">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 className="text-sm font-bold text-amber-800 uppercase tracking-wide">Proceso de selección — no puede operar solo todavía</h3>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <SinglePhotoUploader foto={d.documentos.fotoId} onChange={(v) => onCompletarDocumentos(d.id, { fotoId: v })} label="Foto del DNI / NIE" />
            <SinglePhotoUploader foto={d.documentos.fotoLicencia} onChange={(v) => onCompletarDocumentos(d.id, { fotoLicencia: v })} label="Foto del carnet de conducir" />
          </div>
          <Field label="Cuenta bancaria (IBAN)">
            <input defaultValue={d.documentos.iban} onBlur={e => onCompletarDocumentos(d.id, { iban: e.target.value })} className={inputCls(false)} placeholder="Ej. ES91 2100 0418 4502 0005 1332" />
          </Field>
          <div className="mt-4 bg-white rounded-lg p-4">
            <div className="flex items-center justify-between mb-2">
              <span className="text-sm font-semibold text-slate-700">Servicios supervisados (acompañado por otro conductor/responsable)</span>
              <span className="text-sm font-bold text-slate-800">{d.serviciosSupervisados}/{d.serviciosRequeridos}</span>
            </div>
            <div className="w-full h-2 rounded-full bg-slate-100 overflow-hidden mb-3">
              <div className="h-full rounded-full transition-all" style={{ width: `${(d.serviciosSupervisados / d.serviciosRequeridos) * 100}%`, backgroundColor: brand.color }}></div>
            </div>
            <div className="flex gap-2 flex-wrap">
              <button
                type="button"
                disabled={d.procesoEstado !== 'en_supervision' || d.serviciosSupervisados >= d.serviciosRequeridos}
                onClick={() => onAvanzarSupervision(d.id)}
                className="px-3 py-2 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed"
              >Marcar servicio supervisado como completado</button>
              <button
                type="button"
                disabled={d.serviciosSupervisados < d.serviciosRequeridos}
                onClick={() => onDarDeAlta(d.id)}
                className="px-3 py-2 rounded-lg text-xs font-semibold text-white disabled:opacity-40 disabled:cursor-not-allowed"
                style={{ backgroundColor: brand.color }}
              >Dar de alta (activar)</button>
            </div>
            {d.procesoEstado === 'documentos_pendientes' && <p className="text-[11px] text-amber-600 mt-2">Completa DNI, carnet e IBAN para pasar a supervisión.</p>}
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-xs text-slate-400">Calificación</div>
          <div className="text-xl font-bold text-slate-800">{d.calificacion > 0 ? `⭐ ${d.calificacion.toFixed(1)}` : '—'}</div>
          <div className="text-[11px] text-slate-400">{d.totalCalificaciones} valoraciones</div>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-xs text-slate-400">Viajes completados</div>
          <div className="text-xl font-bold text-slate-800">{completados.length}</div>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-xs text-slate-400">Incidentes</div>
          <div className="text-xl font-bold text-slate-800">{d.incidentes.length}</div>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-xs text-slate-400">Conductor desde</div>
          <div className="text-sm font-bold text-slate-800">{formatDayLabel(d.ingreso)}</div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <SeccionCard title={`Viajes en curso / próximos (${enCurso.length + proximos.length})`}>
          {enCurso.length + proximos.length === 0 ? <p className="text-sm text-slate-400 italic">Sin viajes activos.</p> : (
            <div className="space-y-2">
              {[...enCurso, ...proximos].map(t => {
                const cliente = getClient(t.clienteId);
                return (
                  <div key={t.id} className="flex items-center justify-between text-sm bg-slate-50 rounded-lg px-3 py-2">
                    <span className="font-mono text-xs text-slate-500">{t.id}</span>
                    <span className="text-slate-700">{cliente ? cliente.nombre : '—'}</span>
                    <EstadoPill estado={t.estado} />
                  </div>
                );
              })}
            </div>
          )}
        </SeccionCard>

        <SeccionCard title="Incidentes reportados">
          {d.incidentes.length === 0 ? <p className="text-sm text-slate-400 italic">Sin incidentes registrados.</p> : (
            <div className="space-y-2">
              {d.incidentes.map((inc, i) => (
                <div key={i} className="bg-slate-50 rounded-lg p-3">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-xs font-semibold text-slate-700">{inc.tipo}</span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${inc.gravedad === 'Alto' ? 'bg-red-100 text-red-600' : inc.gravedad === 'Medio' ? 'bg-amber-100 text-amber-600' : 'bg-slate-200 text-slate-600'}`}>{inc.gravedad}</span>
                  </div>
                  <p className="text-xs text-slate-500">{inc.descripcion}</p>
                  <p className="text-[10px] text-slate-400 mt-1">{formatDayLabel(inc.fecha)}</p>
                </div>
              ))}
            </div>
          )}
        </SeccionCard>

        <SeccionCard title={`Historial de viajes completados (${completados.length})`} right={null}>
          {completados.length === 0 ? <p className="text-sm text-slate-400 italic">Sin viajes completados todavía.</p> : (
            <div className="space-y-2 max-h-72 overflow-y-auto">
              {completados.map(t => {
                const cliente = getClient(t.clienteId);
                const vehiculo = getVehicle(t.vehiculoId);
                return (
                  <div key={t.id} className="flex items-center justify-between text-sm bg-slate-50 rounded-lg px-3 py-2">
                    <span className="font-mono text-xs text-slate-500">{t.id}</span>
                    <span className="text-slate-700 text-xs">{cliente ? cliente.nombre : '—'} · {vehiculo ? vehiculo.matricula : ''}</span>
                    <span className="text-xs text-slate-400">{formatDayLabel(t.fecha)}</span>
                  </div>
                );
              })}
            </div>
          )}
        </SeccionCard>

        <SeccionCard title={`Valoraciones de clientes (${d.valoraciones.length})`}>
          {d.valoraciones.length === 0 ? <p className="text-sm text-slate-400 italic">Todavía sin encuestas de satisfacción respondidas.</p> : (
            <div className="space-y-2 max-h-72 overflow-y-auto">
              {[...d.valoraciones].reverse().map((v, i) => (
                <div key={i} className="bg-slate-50 rounded-lg p-3">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-xs font-semibold text-amber-600">{'⭐'.repeat(v.estrellas)}</span>
                    <span className="font-mono text-[10px] text-slate-400">{v.trasladoId}</span>
                  </div>
                  <p className="text-xs text-slate-600">{v.comentario}</p>
                  <p className="text-[10px] text-slate-400 mt-1">{formatDayLabel(v.fecha)}</p>
                </div>
              ))}
            </div>
          )}
        </SeccionCard>
      </div>
    </div>
  );
}
