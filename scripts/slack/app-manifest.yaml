# Pégalo en https://api.slack.com/apps?new_app=1 → From a manifest.
# Esta app es SOLO el bot de notificaciones (CI / deploy).
# Cursor es otra app, ya instalada en el workspace.
display_information:
  name: Mecanu Bot
  description: Avisos de CI y deploys de mecanu.com. No responde a menciones.
  background_color: "#111111"
features:
  bot_user:
    display_name: Mecanu
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - chat:write.public
      - pins:read
      - pins:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
