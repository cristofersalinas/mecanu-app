name: Contacto borradores (flush 1 h)

# Cada 20 min: avisa por correo + Slack los formularios /contacto
# abandonados ≥1 h (pestaña Borradores de la Sheet de leads).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  flush:
    name: flush-borradores
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Flush abandonos
        env:
          CONTACTO_CRON_SECRET: ${{ secrets.CONTACTO_CRON_SECRET }}
          MECANU_SITE_URL: ${{ vars.MECANU_SITE_URL || 'https://mecanu.com' }}
        run: |
          if [ -z "$CONTACTO_CRON_SECRET" ]; then
            echo "Falta secret CONTACTO_CRON_SECRET — skip"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CONTACTO_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${MECANU_SITE_URL}/api/v1/contacto/borrador/flush"
