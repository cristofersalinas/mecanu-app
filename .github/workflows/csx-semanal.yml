name: CSX semanal Slack

# Lunes 07:00 UTC ≈ 08:00–09:00 en Madrid. Destacados + accionables en #csx.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      tipo:
        description: Qué publicar
        type: choice
        required: true
        default: paquete_semanal
        options:
          - paquete_semanal
          - destacados
          - upsell
          - subuso

jobs:
  csx:
    name: publicar-csx
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Publicar
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_CSX: ${{ vars.SLACK_CHANNEL_CSX }}
          CSX_TIPO: ${{ github.event.inputs.tipo || 'paquete_semanal' }}
        run: npx --yes tsx scripts/csx-semanal.ts
