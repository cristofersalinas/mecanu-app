name: CI

# Runs on every push and every pull request targeting any branch, so both
# feature branches and the staging/main integration branches get checked.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No .nvmrc exists in this repo yet, so this pins Node 20 directly.
      # If an .nvmrc is added later, switch this to
      # `node-version-file: ".nvmrc"` instead of a hardcoded version.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # NOTE: the "test" script depends on the Vitest setup landing in a
      # separate task. Once package.json has a "test" script wired to
      # Vitest, this step will start actually running the suite. Until
      # then this step will fail loudly if "test" is missing, which is
      # the correct signal to finish that setup before relying on CI.
      - name: Test
        run: npm test

# Deploy gate: this workflow must be configured as a required status check
# (GitHub branch protection, or Vercel's "wait for CI" setting) on `staging`
# and `main` so that a failing build/lint/test blocks the deploy instead of
# shipping broken code.
