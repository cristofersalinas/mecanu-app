name: Production deploy watch

# If Vercel fails to build/alias production, mecanu.com stays on the previous
# deploy with no UI warning. Open a GitHub issue so it cannot go unnoticed.
on:
  deployment_status:

jobs:
  alert-on-failure:
    name: Alert if production deploy failed
    if: >
      github.event.deployment_status.state == 'failure' &&
      (
        github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'production' ||
        github.event.deployment.environment == 'Production – mecanu-app'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const env = context.payload.deployment.environment;
            const desc = context.payload.deployment_status.description || '';
            const target = context.payload.deployment_status.target_url || '';
            const sha = context.payload.deployment.sha;
            const title = 'Producción: el deploy falló — mecanu.com sigue en la versión anterior';
            const body = [
              'El build de **producción** ha fallado. Vercel **no** cambia el alias de mecanu.com: los usuarios siguen viendo el deploy anterior.',
              '',
              `- Entorno: \`${env}\``,
              `- Commit: \`${sha}\``,
              `- Log: ${target || '(sin URL)'}`,
              desc ? `- Detalle: ${desc}` : '',
              '',
              '## Qué hacer',
              '1. Abrir el log de Vercel y leer el error (casi siempre `next build` / TypeScript).',
              '2. Arreglarlo en una rama `fix/…`, PR a `main` **solo cuando `production-gate` esté verde**.',
              '3. Confirmar con `npx vercel inspect mecanu.com` que el alias apunta al deploy nuevo (status Ready).',
              '',
              '_Issue abierta por `.github/workflows/production-deploy-watch.yml`._',
            ].filter(Boolean).join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-production',
              per_page: 5,
            });
            const dup = existing.data.find((i) => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Otro fallo:\n\n${body}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['deploy-production'],
            });
